<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal | Epispace</title>
    <meta name="description" content="Request Epispace's proposal on local-story AR. For local governments, shopping streets, destinations, and festivals.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://epispace.kr/en/proposal-download.html">
    <link rel="alternate" hreflang="ko" href="https://epispace.kr/proposal-download.html">
    <link rel="alternate" hreflang="en" href="https://epispace.kr/en/proposal-download.html">
    <link rel="alternate" hreflang="x-default" href="https://epispace.kr/proposal-download.html">
    <meta property="og:title" content="Proposal | Epispace">
    <meta property="og:description" content="Request Epispace's proposal on local-story AR.">
    <meta property="og:url" content="https://epispace.kr/en/proposal-download.html">
    <meta property="og:image" content="https://epispace.kr/assets/og-image-en.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="ko_KR">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Noto Sans KR', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#FF6B00',
                        'primary-dark': '#E55A00',
                        'dark': '#1a1a1a',
                        'light': '#fafafa',
                        'accent': '#6366f1',
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    
    <style>
        .form-container {
            background: #ffffff;
        }
        
        .loading {
            display: none;
        }
        
        .loading.active {
            display: flex;
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="font-sans bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b border-gray-100/50 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20 gap-4">
                <a href="index.html" class="flex items-center shrink-0">
                    <img src="../assets/epispace-logo.png" alt="Epispace logo" class="h-10 w-auto">
                </a>
                <div class="flex items-center gap-4 text-sm font-medium">
                    <a href="index.html#contact" class="text-gray-600 hover:text-primary">Contact</a>
                    <a href="index.html" class="text-gray-600 hover:text-primary">Home</a>
                    <span>
                        <a href="../proposal-download.html" hreflang="ko" lang="ko" class="text-gray-400">KO</a>
                        <span class="text-gray-300 mx-1">|</span>
                        <a href="proposal-download.html" hreflang="en" lang="en" class="text-gray-900" aria-current="page">EN</a>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex items-center justify-center min-h-screen py-12 px-4">
        <div class="max-w-md w-full">
            <div class="form-container rounded-3xl shadow-xl p-8 border border-gray-100">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-3">Get the proposal</h1>
                    <p class="text-gray-600 text-sm sm:text-base">
                        Leave your details and the Epispace proposal opens right away.
                    </p>
                </div>

                <form id="downloadForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
                        <input type="text" id="name" name="name" required autocomplete="name"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors duration-300 bg-white"
                               placeholder="Alex Kim">
                    </div>

                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700 mb-2">Organization *</label>
                        <input type="text" id="company" name="company" required autocomplete="organization"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors duration-300 bg-white"
                               placeholder="City of ...">
                    </div>

                    <div>
                        <label for="position" class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                        <input type="text" id="position" name="position" autocomplete="organization-title"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors duration-300 bg-white"
                               placeholder="Director, producer, officer">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                        <input type="email" id="email" name="email" required autocomplete="email"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors duration-300 bg-white"
                               placeholder="example@company.com">
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors duration-300 bg-white"
                               placeholder="+1 604 555 0100">
                    </div>

                    <div>
                        <label for="interest" class="block text-sm font-medium text-gray-700 mb-2">Interest</label>
                        <select id="interest" name="interest"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors duration-300 bg-white">
                            <option value="">Choose one</option>
                            <option value="Local story AR trails">Local story AR trails</option>
                            <option value="Festival and event AR">Festival and event AR</option>
                            <option value="Virtual out-of-home">Virtual out-of-home</option>
                            <option value="Local government or destination">Working with a local government or destination</option>
                            <option value="Overseas partnership">Overseas partnership</option>
                            <option value="Other">Something else</option>
                        </select>
                    </div>

                    <div class="hidden" aria-hidden="true">
                        <label for="website">Website</label>
                        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                    </div>

                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" id="privacy" name="privacy" required
                                   class="mt-1 w-4 h-4 shrink-0 text-primary border-gray-300 rounded focus:ring-primary">
                            <label for="privacy" class="text-sm text-gray-700 leading-relaxed">
                                <span class="font-medium">I agree to the collection and use of this information.</span>
                                <span class="block text-xs text-gray-500 mt-2 space-y-1">
                                    <span class="block">What we collect: name, organization and email (required); role, phone and interest (optional).</span>
                                    <span class="block">Why: to send the proposal and follow up about working together.</span>
                                    <span class="block">How long: we delete it once that purpose is met, or right away if you ask.</span>
                                    <span class="block">You may decline, but then we cannot send the proposal.</span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" 
                            class="w-full bg-primary text-white py-4 px-6 rounded-lg font-semibold text-lg hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <span class="submit-text">Get the proposal</span>
                        <div class="loading items-center justify-center">
                            <div class="spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full mr-2"></div>
                            Sending...
                        </div>
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-200/50 text-center">
                    <p class="text-xs text-gray-500">
                        Questions: 
                        <a href="mailto:contact@epispace.kr" class="text-primary hover:underline">contact@epispace.kr</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" role="dialog" aria-modal="true" aria-labelledby="successTitle">
        <div class="bg-white rounded-3xl p-8 max-w-md mx-4 shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 id="successTitle" class="text-xl font-bold text-gray-900 mb-2">Thank you</h3>
                <p class="text-gray-600 mb-6">The button below opens the proposal in a new tab.</p>
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <a id="proposalLink" href="https://drive.google.com/file/d/1mcovaTRW_W4P7u6S3iOnKjYqjgqBYPL5/view?usp=share_link" target="_blank" rel="noopener" onclick="closeModal()"
                       class="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-primary-dark transition-colors">
                        Open the proposal
                    </a>
                    <button type="button" onclick="closeModal()"
                            class="border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-medium hover:border-gray-400 transition-colors">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 배포한 Apps Script 웹 앱 주소(…/exec). 만드는 방법은 apps-script/proposal-leads.gs 참고.
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzU3mvR9nw57cb6q8N9aFTSnYMAv6zA8ObsoiK-Ym_kEApN5mFMl2DkTAYhiAw_Kdjkww/exec';

        document.getElementById('downloadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            const submitText = submitBtn.querySelector('.submit-text');
            const loading = submitBtn.querySelector('.loading');
            
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            loading.classList.add('active');
            
            const formData = new FormData(form);
            const body = new URLSearchParams({
                name: formData.get('name'),
                company: formData.get('company'),
                position: formData.get('position') || '',
                email: formData.get('email'),
                phone: formData.get('phone') || '',
                interest: formData.get('interest') || '',
                website: formData.get('website') || '',
                lang: 'en',
                page: location.href
            });
            
            try {
                if (GOOGLE_APPS_SCRIPT_URL.startsWith('https://')) {
                    // Apps Script 웹 앱은 CORS 헤더를 주지 않으므로, 응답은 읽지 않고 보내기만 합니다.
                    await fetch(GOOGLE_APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body });
                }
                form.reset();
                showSuccessModal();
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('Something went wrong. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                loading.classList.remove('active');
            }
        });
        
        function showSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('.bg-white').classList.add('scale-100');
                modal.querySelector('.bg-white').classList.remove('scale-95');
                document.getElementById('proposalLink').focus();
            }, 10);
        }
        
        function closeModal() {
            const modal = document.getElementById('successModal');
            modal.querySelector('.bg-white').classList.add('scale-95');
            modal.querySelector('.bg-white').classList.remove('scale-100');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !document.getElementById('successModal').classList.contains('hidden')) {
                closeModal();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.form-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.6s ease-out';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXQEGVBYP8"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-DXQEGVBYP8');
        
        // 페이지 조회 이벤트
        gtag('event', 'page_view', {
            page_title: 'Proposal Download Form',
            page_location: window.location.href
        });
    </script>
</body>
</html>
