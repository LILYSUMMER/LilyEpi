<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 월드 트래킹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #camera-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        .camera-permission {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 2000;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .camera-permission.show {
            display: block !important;
            animation: fadeInScale 0.3s ease-out;
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .permission-btn {
            background: #00C79F;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .permission-btn:hover {
            background: #00a085;
            transform: translateY(-2px);
        }
        
        .permission-btn.secondary {
            background: #666;
        }
        
        .permission-btn.secondary:hover {
            background: #777;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 20px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px) scale(1.1);
        }
        
        .anchor-point {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 255, 0, 0.8);
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        }
        
        .world-tracking-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .world-tracking-info.show {
            opacity: 1;
        }
        
        .loading-text {
            margin-top: 15px;
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>🌍 AR 월드 트래킹</h2>
        <div class="loading-text" id="loading-text">월드 트래킹 초기화 중...</div>
    </div>
    
    <!-- 카메라 권한 요청 -->
    <div id="camera-permission" class="camera-permission">
        <h3>🌍 AR 월드 트래킹</h3>
        <p>실제 공간에 고정되는 AR 체험을 위해<br>카메라와 센서 접근이 필요합니다.</p>
        <div style="margin: 20px 0;">
            <button class="permission-btn" onclick="requestPermissions()">
                🚀 시작하기
            </button>
            <br>
            <button class="permission-btn secondary" onclick="skipCamera()">
                건너뛰기
            </button>
        </div>
    </div>
    
    <!-- 월드 트래킹 정보 -->
    <div id="world-tracking-info" class="world-tracking-info">
        화면을 터치해서 AR 앵커 포인트를 생성하세요
    </div>
    
    <!-- 카메라 배경 -->
    <video id="camera-background" autoplay muted playsinline></video>
    
    <!-- 3D 컨테이너 -->
    <div id="container">
        <div id="three-container"></div>
    </div>
    
    <!-- 컨트롤 -->
    <div class="controls">
        <button class="control-btn" onclick="toggleVideo()" title="재생/정지">⏯️</button>
        <button class="control-btn" onclick="resetAnchors()" title="앵커 리셋">🎯</button>
        <a href="index.html" class="control-btn" title="홈으로">🏠</a>
    </div>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // 전역 변수
        let scene, camera, renderer, video, videoTexture, videoMesh;
        let cameraStream = null;
        let cameraVideo = null;
        let isCameraActive = false;
        let worldTracking = {
            anchors: [],
            deviceOrientation: { alpha: 0, beta: 0, gamma: 0 },
            isTracking: false
        };
        
        // 월드 트래킹 초기화
        function initializeWorldTracking() {
            console.log('월드 트래킹 초기화');
            
            // 디바이스 방향 센서
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleDeviceOrientation);
                console.log('디바이스 방향 센서 활성화');
            }
            
            // 디바이스 모션 센서
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleDeviceMotion);
                console.log('디바이스 모션 센서 활성화');
            }
            
            // 터치 이벤트로 앵커 포인트 생성
            document.addEventListener('touchstart', handleTouch);
            document.addEventListener('click', handleTouch);
            
            worldTracking.isTracking = true;
            showWorldTrackingInfo();
        }
        
        function handleDeviceOrientation(event) {
            worldTracking.deviceOrientation = {
                alpha: event.alpha || 0,  // Z축 회전
                beta: event.beta || 0,    // X축 회전
                gamma: event.gamma || 0   // Y축 회전
            };
            
            // 카메라 방향을 디바이스 방향에 맞춰 조정
            if (camera && worldTracking.isTracking) {
                updateCameraOrientation();
            }
        }
        
        function handleDeviceMotion(event) {
            // 가속도 정보로 더 정밀한 트래킹 (필요시)
            const acceleration = event.acceleration;
            if (acceleration && worldTracking.isTracking) {
                // 미세한 움직임 보정 가능
            }
        }
        
        function updateCameraOrientation() {
            if (!camera) return;
            
            const { alpha, beta, gamma } = worldTracking.deviceOrientation;
            
            // 디바이스 방향을 Three.js 카메라 회전으로 변환
            const alphaRad = (alpha * Math.PI) / 180;
            const betaRad = (beta * Math.PI) / 180;
            const gammaRad = (gamma * Math.PI) / 180;
            
            // 카메라 회전 적용 (부드럽게)
            camera.rotation.x += (betaRad - camera.rotation.x) * 0.1;
            camera.rotation.y += (alphaRad - camera.rotation.y) * 0.1;
            camera.rotation.z += (gammaRad - camera.rotation.z) * 0.1;
        }
        
        function handleTouch(event) {
            if (!worldTracking.isTracking) return;
            
            event.preventDefault();
            
            // 터치 위치 가져오기
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            // 앵커 포인트 생성
            createAnchor(clientX, clientY);
        }
        
        function createAnchor(x, y) {
            // 화면 좌표를 3D 공간 좌표로 변환
            const mouse = new THREE.Vector2();
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // 가상 평면과의 교차점 계산 (바닥면 가정)
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersectPoint);
            
            // 앵커 포인트 생성
            const anchor = {
                id: Date.now(),
                position: intersectPoint.clone(),
                screenPosition: { x, y },
                timestamp: Date.now()
            };
            
            worldTracking.anchors.push(anchor);
            
            // 비디오 메시를 앵커 위치로 이동
            if (videoMesh && worldTracking.anchors.length === 1) {
                videoMesh.position.copy(anchor.position);
                videoMesh.position.y += 1; // 바닥에서 1미터 위에 배치
                console.log('비디오 앵커 설정:', anchor.position);
            }
            
            // 시각적 앵커 표시
            showAnchorPoint(x, y);
            
            console.log('앵커 생성:', anchor);
        }
        
        function showAnchorPoint(x, y) {
            const anchorElement = document.createElement('div');
            anchorElement.className = 'anchor-point';
            anchorElement.style.left = x + 'px';
            anchorElement.style.top = y + 'px';
            document.body.appendChild(anchorElement);
            
            // 3초 후 제거
            setTimeout(() => {
                document.body.removeChild(anchorElement);
            }, 3000);
        }
        
        function showWorldTrackingInfo() {
            const info = document.getElementById('world-tracking-info');
            info.classList.add('show');
            
            setTimeout(() => {
                info.classList.remove('show');
            }, 5000);
        }
        
        function resetAnchors() {
            worldTracking.anchors = [];
            
            // 비디오 위치 초기화
            if (videoMesh) {
                videoMesh.position.set(0, 0, 0);
            }
            
            // 기존 앵커 포인트 제거
            document.querySelectorAll('.anchor-point').forEach(el => el.remove());
            
            console.log('앵커 리셋');
        }
        
        // 로딩 상태 업데이트
        function updateLoadingText(text) {
            const loadingText = document.getElementById('loading-text');
            if (loadingText) {
                loadingText.textContent = text;
            }
            console.log('Loading:', text);
        }
        
        // 초기화
        function initialize() {
            console.log('AR 월드 트래킹 초기화 시작');
            updateLoadingText('센서 확인 중...');
            
            setTimeout(() => {
                updateLoadingText('권한 요청 준비...');
                
                setTimeout(() => {
                    showCameraPermission();
                    updateLoadingText('권한 대기 중...');
                }, 500);
            }, 1500);
        }
        
        function showCameraPermission() {
            const permissionDiv = document.getElementById('camera-permission');
            permissionDiv.classList.add('show');
        }
        
        function hideCameraPermission() {
            const permissionDiv = document.getElementById('camera-permission');
            permissionDiv.classList.remove('show');
        }
        
        async function requestPermissions() {
            hideCameraPermission();
            updateLoadingText('센서 권한 요청 중...');
            
            // iOS에서 디바이스 방향 권한 요청
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    console.log('디바이스 방향 권한:', permission);
                } catch (error) {
                    console.log('디바이스 방향 권한 요청 실패:', error);
                }
            }
            
            // iOS에서 디바이스 모션 권한 요청
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    console.log('디바이스 모션 권한:', permission);
                } catch (error) {
                    console.log('디바이스 모션 권한 요청 실패:', error);
                }
            }
            
            updateLoadingText('카메라 접근 중...');
            
            // 카메라 권한 요청
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                cameraStream = stream;
                cameraVideo = document.getElementById('camera-background');
                cameraVideo.srcObject = stream;
                isCameraActive = true;
                
                updateLoadingText('월드 트래킹 설정 중...');
                
                setTimeout(() => {
                    initializeThreeJS();
                    initializeWorldTracking();
                }, 1000);
                
            } catch (error) {
                console.error('카메라 접근 실패:', error);
                updateLoadingText('카메라 없이 진행...');
                setTimeout(() => {
                    initializeWithoutCamera();
                    initializeWorldTracking();
                }, 1000);
            }
        }
        
        function skipCamera() {
            hideCameraPermission();
            updateLoadingText('센서 모드로 진행...');
            setTimeout(() => {
                initializeWithoutCamera();
                initializeWorldTracking();
            }, 1000);
        }
        
        function initializeWithoutCamera() {
            document.getElementById('camera-background').style.display = 'none';
            initializeThreeJS();
        }
        
        function initializeThreeJS() {
            console.log('Three.js 초기화');
            
            try {
                updateLoadingText('3D 환경 생성 중...');
                
                // 씬 생성
                scene = new THREE.Scene();
                
                if (!isCameraActive) {
                    scene.background = new THREE.Color(0x111111);
                }
                
                // 카메라 생성
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 3); // 사람 눈높이
                
                // 렌더러 생성
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.setClearColor(0x000000, isCameraActive ? 0 : 1);
                
                document.getElementById('three-container').appendChild(renderer.domElement);
                
                // 조명
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                // 비디오 엘리먼트
                video = document.createElement('video');
                video.src = 'assets/lee.mp4';
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                // 비디오 텍스처
                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                
                // 비디오 스크린 (AR 오브젝트)
                const screenGeometry = new THREE.PlaneGeometry(2.4, 1.35); // 16:9 비율
                const screenMaterial = new THREE.MeshLambertMaterial({ 
                    map: videoTexture,
                    transparent: true,
                    opacity: 0.95
                });
                
                videoMesh = new THREE.Mesh(screenGeometry, screenMaterial);
                videoMesh.position.set(0, 1, 0); // 1미터 높이에 배치
                videoMesh.castShadow = true;
                scene.add(videoMesh);
                
                // 간단한 바닥 추가 (월드 트래킹 참조용)
                const floorGeometry = new THREE.PlaneGeometry(10, 10);
                const floorMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0x404040,
                    transparent: true,
                    opacity: isCameraActive ? 0 : 0.3
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                scene.add(floor);
                
                // 비디오 로드 이벤트
                video.addEventListener('loadeddata', () => {
                    console.log('비디오 로드 완료');
                    video.play().catch(console.log);
                });
                
                // 렌더 루프
                animate();
                
                // 리사이즈 이벤트
                window.addEventListener('resize', onWindowResize);
                
                updateLoadingText('완료!');
                setTimeout(finishLoading, 1000);
                
            } catch (error) {
                console.error('Three.js 초기화 실패:', error);
                updateLoadingText('초기화 실패');
                setTimeout(finishLoading, 2000);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // 월드 트래킹 업데이트
            if (worldTracking.isTracking) {
                updateWorldTracking();
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function updateWorldTracking() {
            // 앵커 포인트가 있으면 비디오를 고정
            if (worldTracking.anchors.length > 0 && videoMesh) {
                const anchor = worldTracking.anchors[0];
                
                // 디바이스 방향 변화에 따른 보정
                const orientationOffset = new THREE.Vector3(
                    Math.sin(worldTracking.deviceOrientation.gamma * Math.PI / 180) * 0.1,
                    0,
                    Math.sin(worldTracking.deviceOrientation.beta * Math.PI / 180) * 0.1
                );
                
                // 비디오 위치를 앵커에 고정 (약간의 방향 보정 포함)
                videoMesh.position.copy(anchor.position);
                videoMesh.position.add(orientationOffset);
                videoMesh.position.y += 1; // 바닥에서 1미터 위
                
                // 약간의 자연스러운 애니메이션
                videoMesh.rotation.y += 0.001;
            }
        }
        
        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        function finishLoading() {
            const loading = document.getElementById('loading');
            loading.style.opacity = '0';
            
            setTimeout(() => {
                loading.style.display = 'none';
                console.log('AR 월드 트래킹 준비 완료');
            }, 500);
        }
        
        // 컨트롤 함수
        function toggleVideo() {
            if (video) {
                if (video.paused) {
                    video.play().catch(console.log);
                } else {
                    video.pause();
                }
            }
        }
        
        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
        });
        
        // 초기화 시작
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
    </script>
</body>
</html>
