<html lang="ko">
<head>

    <!-- A-Frame & MindAR (독립적으로 로드) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 레이어 1: 카메라 비디오 — 가장 밑바닥 */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: 1 !important;
            opacity: 1 !important;
            visibility: visible !important;
            display: block !important;
            background: transparent !important;
            pointer-events: none !important;
        }

        /* 레이어 2: A-Frame 씬 컨테이너 — 비디오 위 */
        a-scene {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 5 !important;
            background: transparent !important;
        }

        /* 레이어 3: WebGL 캔버스 — 씬 내 최상단 */
        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: transparent !important;
            background-color: transparent !important;
            z-index: 10 !important;
            pointer-events: none !important;
        }
        
        /* 시작 메뉴 */
        #start-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d1f3d 0%, #1a1a2e 50%, #2d1f3d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 30px;
        }
        
        #start-menu.hidden {
            display: none;
        }
        
        .start-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffb6c1;
            text-shadow: 0 0 30px rgba(255, 182, 193, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }
        
        .start-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            text-align: center;
        }
        
        .mode-btn {
            width: 280px;
            padding: 22px 30px;
            margin: 10px 0;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        .mode-btn:active {
            transform: scale(0.97);
        }
        
        #btn-mode-blossom {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            color: white;
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.4);
        }
        
        #btn-mode-blossom .mode-desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.9;
        }
        
        #btn-mode-kit {
            background: linear-gradient(135deg, #9c27b0 0%, #e91e63 100%);
            color: white;
            box-shadow: 0 8px 30px rgba(156, 39, 176, 0.4);
        }
        
        #btn-mode-kit .mode-desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.9;
        }
        
        .start-footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        
        /* 에러 오버레이 */
        #error-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            color: white;
            text-align: center;
            padding: 30px;
        }
        
        #error-overlay.show { display: flex; }
        
        #error-overlay .error-icon { font-size: 60px; margin-bottom: 20px; }
        #error-overlay .error-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; color: #ff6b9d; }
        #error-overlay .error-message { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.6; }
        #error-overlay .retry-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* 뒤로가기 버튼 */
        #back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        #back-button.show { display: flex; }
        #back-button:active { transform: scale(0.95); }
        
        /* 따뜻한 톤 오버레이 */
        #warm-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                180deg,
                rgba(255, 200, 180, 0.08) 0%,
                rgba(255, 180, 200, 0.05) 50%,
                rgba(255, 200, 180, 0.08) 100%
            );
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: soft-light;
            display: none;
        }
        
        #warm-overlay.show { display: block; }
        
        /* 셔터 플래시 */
        #shutter-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
        }
        
        #shutter-flash.flash { animation: shutterFlash 0.4s ease-out; }
        
        @keyframes shutterFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* 가이드 UI */
        #guide-ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }
        
        #guide-ui.show { display: flex; }
        #guide-ui.hidden { opacity: 0; pointer-events: none; }
        
        #guide-image {
            width: 55vmin;
            max-width: 260px;
            object-fit: contain;
            opacity: 0.55;
            filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.6));
            animation: guidePulse 2.5s ease-in-out infinite;
        }
        
        @keyframes guidePulse {
            0%, 100% { transform: scale(1); opacity: 0.55; }
            50% { transform: scale(1.02); opacity: 0.65; }
        }
        
        #guide-text {
            margin-top: 24px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.45);
            padding: 12px 24px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        
        /* 로딩 화면 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d1f3d 0%, #1a1a2e 50%, #2d1f3d 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease-out;
        }
        
        #loading-screen.show { display: flex; }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        
        .loading-spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255, 182, 193, 0.3);
            border-top-color: #ffb6c1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text {
            margin-top: 20px;
            color: #ffb6c1;
            font-size: 15px;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
        }
        
        .loading-subtitle {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }
        
        /* 버튼 컨테이너 */
        #button-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            z-index: 300;
            transition: opacity 0.3s ease;
        }
        
        #button-container.show { display: flex; }
        #button-container.hidden { opacity: 0; pointer-events: none; }
        
        /* 공통 버튼 스타일 */
        .ar-btn {
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }
        
        .ar-btn:active { transform: scale(0.95); }
        .ar-btn.show { display: block; animation: buttonPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        #scan-button {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            box-shadow: 0 6px 25px rgba(255, 107, 157, 0.5);
        }
        
        #scan-button.scanned {
            background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
        }
        
        
        @keyframes buttonPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 카운트다운 */
        #photo-countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 800;
            color: white;
            text-shadow: 
                0 0 60px rgba(255, 182, 193, 0.9),
                0 0 100px rgba(255, 107, 157, 0.6),
                0 6px 30px rgba(0,0,0,0.4);
            z-index: 600;
            opacity: 0;
            pointer-events: none;
        }
        
        #photo-countdown.show {
            animation: countdownPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes countdownPop {
            0% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        /* 토스트 */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px 30px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            z-index: 500;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        #toast .icon { font-size: 40px; display: block; margin-bottom: 10px; }
        
        /* 상태바 */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            color: white;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(255, 107, 157, 0.5);
        }
        
        #status-bar.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        #status-bar.hidden { opacity: 0 !important; }
        
        /* 전경 꽃잎 */
        /* petal-canvas: Canvas 2D 파티클 시스템 (캡처/녹화에 포함됨) */
        
        /* 텍스처 프리뷰 */
        #texture-preview {
            position: fixed;
            bottom: 100px;
            right: 15px;
            width: 70px;
            height: 70px;
            border: 3px solid rgba(255, 182, 193, 0.8);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
            z-index: 250;
            display: none;
            object-fit: cover;
            transition: opacity 0.3s ease;
            image-rendering: -webkit-optimize-contrast;
        }
        
        #texture-preview.show { display: block; animation: previewPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #texture-preview.hidden { opacity: 0; pointer-events: none; }
        
        @keyframes previewPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 미리보기 모달 */
        #capture-preview-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        #capture-preview-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #capture-preview-image {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 16px;
            box-shadow: 0 10px 50px rgba(255, 182, 193, 0.3);
            image-rendering: -webkit-optimize-contrast;
        }
        
        #capture-preview-info {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }
        
        #capture-preview-close {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* canvas-layer1~3 은 style="display:none" 으로 직접 제어 */
        
        /* ===== 인스타그램 스토리 스타일 촬영 버튼 ===== */
        #capture-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            border: 5px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        
        #capture-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.2s ease;
        }
        
        #capture-btn.pressing {
            transform: scale(1.15);
        }
        
        #capture-btn.pressing::before {
            background: #ff4757;
            border-radius: 8px;
            width: 30px;
            height: 30px;
        }
        
        #capture-btn.recording::before {
            background: #ff4757;
            border-radius: 8px;
            width: 30px;
            height: 30px;
            animation: recordPulse 1s ease-in-out infinite;
        }
        
        @keyframes recordPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        /* 녹화 타이머 */
        #record-timer {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 71, 87, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            z-index: 600;
            display: none;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }
        
        #record-timer.show {
            display: flex;
        }
        
        #record-timer::before {
            content: '';
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: recordDot 1s ease-in-out infinite;
        }
        
        @keyframes recordDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* 카메라 전환 버튼 */
        #camera-switch-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        #camera-switch-btn.show {
            display: flex;
        }
        
        #camera-switch-btn.hidden {
            display: none !important;
        }
        
        #camera-switch-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }
        
        #camera-switch-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
            transition: transform 0.5s ease;
        }
        
        #camera-switch-btn.switching svg {
            transform: rotate(180deg);
        }
        
        /* 셀카 모드 (거울 효과) */
        .selfie-mode video {
            transform: scaleX(-1) !important;
        }
        
        .selfie-mode .a-canvas {
            transform: scaleX(-1) !important;
        }
        
        /* 녹화 중 프로그레스 링 */
        #capture-btn .progress-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 96px;
            height: 96px;
            transform: rotate(-90deg);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        #capture-btn.recording .progress-ring {
            opacity: 1;
        }
        
        .progress-ring circle {
            fill: none;
            stroke: #ff4757;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
        }
        
        /* ===== 영상 미리보기 모달 (인스타그램 스타일) ===== */
        #video-preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9500;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }
        
        #video-preview-modal.show {
            display: flex;
        }
        
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #video-preview-modal .preview-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 71, 87, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
        }
        
        #video-preview-modal .preview-header::before {
            content: '🎬';
        }
        
        #video-preview-modal .preview-video-container {
            position: relative;
            max-width: 90%;
            max-height: 60vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.3);
        }
        
        #video-preview-modal video {
            position: relative !important;
            width: 100% !important;
            height: auto !important;
            max-height: 60vh;
            object-fit: contain !important;
            border-radius: 16px;
            z-index: auto !important;
        }
        
        #video-preview-modal .preview-info {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            display: flex;
            gap: 15px;
        }
        
        #video-preview-modal .preview-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

    <script>
        // ===== WebGL 컨텍스트 설정을 위한 씬 초기화 전 처리 =====
        // preserveDrawingBuffer는 A-Frame 씬 생성 전에 설정해야 함
        AFRAME.registerComponent('webgl-settings', {
            init: function() {
                // 렌더러가 생성된 후 설정 확인
                const renderer = this.el.renderer;
                if (renderer) {
                    const gl = renderer.getContext();
                    const attrs = gl.getContextAttributes();
                    console.log('🎨 WebGL 설정:', attrs);
                }
            }
        });
        
        // ===== 🔥 ar-recorder: 벚꽃 파티클 완벽 캡처/녹화 A-Frame 컴포넌트 =====
        // tock (렌더링 직후)에 기생하여 합성 → 빈 버퍼 문제 완전 해결
        AFRAME.registerComponent('ar-recorder', {
            init: function() {
                // 상태 관리
                this.isRecording = false;
                this.isCapturingPhoto = false;
                this.isSelfieMode = false;
                this.chunks = [];
                this.recorder = null;
                this.recordStartTime = 0;
                this.isReady = false;
                this.photoRetryCount = 0;
                this.recordRetryCount = 0;
                
                // 합성용 캔버스 (willReadFrequently로 모바일 병목 해결)
                this.compositeCanvas = document.createElement('canvas');
                this.ctx = this.compositeCanvas.getContext('2d', { 
                    willReadFrequently: true,
                    alpha: false 
                });
                
                // ❌ 비디오 요소를 init에서 미리 할당하지 않음!
                // MindAR은 비디오를 동적으로 생성하므로 사용 시점에 가져와야 함
                
                // 녹화 결과 저장 (미리보기/공유용)
                this.lastBlob = null;
                this.lastBlobUrl = null;
                this.lastMimeType = null;
                this.lastDuration = 0;
                
                // 씬이 로드되면 준비 완료 표시
                const self = this;
                if (this.el.hasLoaded) {
                    this.isReady = true;
                } else {
                    this.el.addEventListener('loaded', function() {
                        self.isReady = true;
                        console.log('🎬 ar-recorder: 씬 로드 완료');
                    });
                }
                
                console.log('🎬 ar-recorder 컴포넌트 초기화 완료');
            },
            
            // ✅ 비디오 요소를 실시간으로 가져오기 (캐싱하지 않음!)
            getVideo: function() {
                // 셀피 모드면 selfie-video 우선 반환
                if (this.isSelfieMode) {
                    const selfie = document.getElementById('selfie-video');
                    if (selfie && selfie.readyState >= 2) return selfie;
                }
                return document.querySelector('video:not(#preview-video):not(#selfie-video)');
            },
            
            // ✅ 비디오가 준비되었는지 확인
            isVideoReady: function() {
                const videoEl = this.getVideo();
                if (!videoEl) {
                    console.log('⏳ 비디오 요소 없음');
                    return false;
                }
                if (videoEl.readyState < 2) {
                    console.log('⏳ 비디오 readyState:', videoEl.readyState);
                    return false;
                }
                if (videoEl.videoWidth === 0 || videoEl.videoHeight === 0) {
                    console.log('⏳ 비디오 크기 없음:', videoEl.videoWidth, videoEl.videoHeight);
                    return false;
                }
                return true;
            },
            
            // object-fit: cover 계산
            getCoverDimensions: function(video, targetW, targetH) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const videoRatio = vw / vh;
                const targetRatio = targetW / targetH;
                
                let sx = 0, sy = 0, sw = vw, sh = vh;
                if (videoRatio > targetRatio) {
                    sw = vh * targetRatio;
                    sx = (vw - sw) / 2;
                } else {
                    sh = vw / targetRatio;
                    sy = (vh - sh) / 2;
                }
                return { sx, sy, sw, sh };
            },
            
            // 캔버스에 비디오 + AR 합성 (셀카 mirror 포함)
            compositeFrame: function() {
                // ✅ 비디오를 실시간으로 가져오기
                const video = this.getVideo();
                // A-Frame 씬의 캔버스 가져오기 (안전한 접근)
                const arCanvas = this.el.canvas || (this.el.sceneEl && this.el.sceneEl.canvas);
                
                // 비디오 준비 상태 검증
                if (!video || video.readyState < 3 || video.videoWidth === 0) {
                    return false;
                }
                if (!arCanvas) return false;
                
                const w = this.compositeCanvas.width;
                const h = this.compositeCanvas.height;
                const { sx, sy, sw, sh } = this.getCoverDimensions(video, w, h);
                
                // 캔버스 클리어
                this.ctx.clearRect(0, 0, w, h);
                
                // 1. 비디오 그리기 (셀카 모드면 좌우 반전)
                if (this.isSelfieMode) {
                    this.ctx.save();
                    this.ctx.scale(-1, 1);
                    this.ctx.drawImage(video, sx, sy, sw, sh, -w, 0, w, h);
                    this.ctx.restore();
                } else {
                    this.ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
                }
                
                // 2. AR 캔버스 덧그리기 (tock 타이밍이라 WebGL 파티클 완벽 포함)
                if (arCanvas && arCanvas.width > 0 && arCanvas.height > 0) {
                    if (this.isSelfieMode) {
                        this.ctx.save();
                        this.ctx.scale(-1, 1);
                        this.ctx.drawImage(arCanvas, -w, 0, w, h);
                        this.ctx.restore();
                    } else {
                        this.ctx.drawImage(arCanvas, 0, 0, w, h);
                    }
                }

                // 3. Canvas 2D 꽃잎 파티클 덧그리기 (캡처/녹화 모두 포함)
                const petalCv = document.getElementById('petal-canvas');
                if (petalCv && petalCv.style.display !== 'none' && petalCv.width > 0) {
                    this.ctx.drawImage(petalCv, 0, 0, w, h);
                }

                return true;
            },
            
            // ===== 📸 스크린샷 (tock 타이밍에서 실행) =====
            takePhoto: function(selfieMode = false) {
                this.isSelfieMode = selfieMode;
                this.isCapturingPhoto = true;
            },
            
            processPhoto: function() {
                const self = this;
                
                // ✅ 비디오 준비 상태 확인 (실시간)
                if (!this.isVideoReady()) {
                    this.photoRetryCount++;
                    console.log(`⏳ 사진 캡처 대기 중... (${this.photoRetryCount}/30)`);

                    if (this.photoRetryCount < 30) {
                        setTimeout(function() {
                            self.isCapturingPhoto = true;
                        }, 200);
                        return;
                    } else {
                        this.photoRetryCount = 0;
                        console.error('❌ 사진 캡처 실패: 30회 시도 후에도 비디오가 준비되지 않았습니다');
                        alert('카메라 준비에 실패했습니다. 새로고침 해주세요.');
                        return;
                    }
                }
                
                // 재시도 카운터 리셋
                this.photoRetryCount = 0;
                
                const video = this.getVideo();
                
                // 고해상도 캔버스 (devicePixelRatio 고려)
                const dpr = window.devicePixelRatio || 1;
                const scale = Math.min(dpr * 2, 4);
                this.compositeCanvas.width = Math.floor(window.innerWidth * scale);
                this.compositeCanvas.height = Math.floor(window.innerHeight * scale);
                
                // 합성
                if (!this.compositeFrame()) {
                    console.warn('❌ 사진 캡처 실패: 합성 오류');
                    if (typeof showToast === 'function') {
                        showToast('캡처 중 오류가 발생했습니다', '❌');
                    }
                    return;
                }
                
                // JPEG 변환 및 다운로드
                const dataUrl = this.compositeCanvas.toDataURL('image/jpeg', 0.95);
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `cherry-blossom-${Date.now()}.jpg`;
                link.click();
                
                console.log('✅ 사진 저장 완료');
                if (typeof showToast === 'function') {
                    showToast('📸 사진이 저장되었습니다!', '🌸');
                }
            },
            
            // ===== 🎬 영상 녹화 시작 =====
            startRecording: function(selfieMode = false, isRetry = false) {
                const self = this;
                
                // ✅ 비디오 준비 상태 확인 (실시간)
                if (!this.isVideoReady()) {
                    if (!isRetry) {
                        this.recordRetryCount = 0;
                    }
                    this.recordRetryCount++;
                    console.log(`⏳ 녹화 대기 중... (${this.recordRetryCount}/30)`);

                    if (this.recordRetryCount < 30) {
                        if (typeof showToast === 'function' && this.recordRetryCount === 1) {
                            showToast('카메라 준비 중...', '⏳');
                        }
                        setTimeout(function() {
                            self.startRecording(selfieMode, true);
                        }, 200);
                        return;
                    } else {
                        this.recordRetryCount = 0;
                        console.error('❌ 녹화 실패: 30회 시도 후에도 비디오가 준비되지 않았습니다');
                        alert('카메라 준비에 실패했습니다. 새로고침 해주세요.');
                        return;
                    }
                }
                
                // 재시도 카운터 리셋
                this.recordRetryCount = 0;
                
                const video = this.getVideo();
                this.isSelfieMode = selfieMode;
                
                // 녹화 해상도 설정 (비디오 원본 기준, 최대 1080p)
                const maxSize = 1080;
                let w = video.videoWidth || window.innerWidth;
                let h = video.videoHeight || window.innerHeight;
                
                if (w > maxSize || h > maxSize) {
                    const ratio = Math.min(maxSize / w, maxSize / h);
                    w = Math.floor(w * ratio);
                    h = Math.floor(h * ratio);
                }
                
                this.compositeCanvas.width = w;
                this.compositeCanvas.height = h;
                
                this.chunks = [];
                const stream = this.compositeCanvas.captureStream(30); // 30 FPS
                
                // 스마트 MIME 타입 선택 (MP4 우선 for iOS)
                let mimeType = 'video/webm';
                const mimeTypes = [
                    'video/mp4;codecs=avc1',
                    'video/mp4',
                    'video/webm;codecs=h264',
                    'video/webm;codecs=vp9',
                    'video/webm'
                ];
                
                for (const type of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        mimeType = type;
                        break;
                    }
                }
                
                console.log('🎥 녹화 MIME 타입:', mimeType);
                
                try {
                    this.recorder = new MediaRecorder(stream, { 
                        mimeType: mimeType,
                        videoBitsPerSecond: 5000000 // 5Mbps
                    });
                } catch (e) {
                    console.warn('MediaRecorder 생성 실패, 폴백:', e);
                    this.recorder = new MediaRecorder(stream);
                    mimeType = 'video/webm';
                }
                
                this.lastMimeType = mimeType;
                
                this.recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        this.chunks.push(e.data);
                    }
                };
                
                this.recorder.onstop = () => {
                    this.lastDuration = Date.now() - this.recordStartTime;
                    this.lastBlob = new Blob(this.chunks, { type: this.lastMimeType });
                    
                    // 이전 URL 정리
                    if (this.lastBlobUrl) {
                        URL.revokeObjectURL(this.lastBlobUrl);
                    }
                    this.lastBlobUrl = URL.createObjectURL(this.lastBlob);
                    
                    // 미리보기 모달 표시
                    this.showPreview();
                };
                
                this.recorder.onerror = (e) => {
                    console.error('녹화 에러:', e);
                    this.stopRecording();
                    if (typeof showToast === 'function') {
                        showToast('녹화 중 오류 발생', '❌');
                    }
                };
                
                this.recorder.start(100); // 100ms 단위로 데이터 수집
                this.isRecording = true;
                this.recordStartTime = Date.now();
                
                console.log('🔴 녹화 시작!');
            },
            
            // ===== 🛑 영상 녹화 종료 =====
            stopRecording: function() {
                if (this.recorder && this.isRecording) {

                    console.log('⬛ 녹화 종료!');
                }

            // ===== 미리보기 모달 표시 =====
            showPreview: function() {
                const modal = document.getElementById('video-preview-modal');
                const previewVideo = document.getElementById('preview-video');
                const formatBadge = document.getElementById('format-badge');
                const videoSizeInfo = document.getElementById('video-size-info');
                const videoFormatInfo = document.getElementById('video-format-info');
                const videoDurationText = document.getElementById('video-duration-text');
                const btnShare = document.getElementById('btn-video-share');
                
                if (!modal || !previewVideo) return;
                
                // 비디오 설정
                previewVideo.src = this.lastBlobUrl;
                previewVideo.load();
                
                // 포맷 정보
                const ext = this.lastMimeType.includes('mp4') ? 'MP4' : 'WEBM';
                if (formatBadge) formatBadge.textContent = ext;
                
                // 파일 크기
                const sizeMB = (this.lastBlob.size / (1024 * 1024)).toFixed(1);
                if (videoSizeInfo) videoSizeInfo.textContent = `📁 ${sizeMB} MB`;
                
                // 포맷
                if (videoFormatInfo) videoFormatInfo.textContent = `🎥 ${ext}`;
                
                // 녹화 시간
                const secs = Math.floor(this.lastDuration / 1000);
                const mins = Math.floor(secs / 60);
                const remainSecs = secs % 60;
                if (videoDurationText) {
                    videoDurationText.textContent = `${mins}:${String(remainSecs).padStart(2, '0')} 녹화 완료`;
                }
                
                // Web Share API 지원 여부
                if (btnShare) {
                    const file = new File([this.lastBlob], `video.${ext.toLowerCase()}`, { type: this.lastMimeType });
                    btnShare.style.display = (navigator.canShare && navigator.canShare({ files: [file] })) ? 'flex' : 'none';
                }
                
                modal.classList.add('show');
            },
            
            // ===== 다운로드 =====
            downloadVideo: function() {
                if (!this.lastBlobUrl) return;
                
                const ext = this.lastMimeType.includes('mp4') ? 'mp4' : 'webm';
                const a = document.createElement('a');
                a.href = this.lastBlobUrl;
                a.download = `cherry-blossom-${Date.now()}.${ext}`;
                document.body.appendChild(a);
                a.click();

                if (typeof showToast === 'function') {
                    showToast('💾 영상이 저장되었습니다!', '✨');
                }
            },
            
            // ===== 공유 (Web Share API) =====
            shareVideo: async function() {
                if (!this.lastBlob) return;
                
                try {
                    const ext = this.lastMimeType.includes('mp4') ? 'mp4' : 'webm';
                    const file = new File([this.lastBlob], `cherry-blossom-${Date.now()}.${ext}`, { type: this.lastMimeType });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: '🌸 벚꽃 AR 영상',
                            text: '벚꽃 터널 AR에서 촬영한 영상입니다!'
                        });
                        if (typeof showToast === 'function') {
                            showToast('📤 공유 완료!', '✨');
                        }
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('공유 실패:', err);
                    }
                }
            },

                }

        // 찰칵 소리
        function createShutterSound() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(800, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.15);
        }

        function spawnFloatPetal() {
            const sv = Math.random();
            let size, maxOpacity, lifeDecay;
            if (sv < 0.3) { size = 12 + Math.random() * 8; maxOpacity = 0.3 + Math.random() * 0.2; lifeDecay = 0.0015; }
            else if (sv < 0.7) { size = 20 + Math.random() * 15; maxOpacity = 0.5 + Math.random() * 0.25; lifeDecay = 0.002; }
            else { size = 35 + Math.random() * 20; maxOpacity = 0.7 + Math.random() * 0.25; lifeDecay = 0.003; }
            petalParticles.push({
                x: Math.random() * petalCanvas.width,
                y: -60,
                vx: (Math.random() - 0.5) * 1.5,
                vy: 1.5 + Math.random() * 2,
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 4,
                size, opacity: 0, maxOpacity, fadeIn: 0, life: 1, lifeDecay
            });
        }

        function animatePetals() {
            petalAnimId = requestAnimationFrame(animatePetals);
            const pctx = petalCanvas.getContext('2d');
            pctx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);

            petalParticles = petalParticles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                p.life -= p.lifeDecay;

                if (p.fadeIn < 1) {
                    p.fadeIn = Math.min(1, p.fadeIn + 0.04);
                    p.opacity = p.fadeIn * p.maxOpacity;
                } else if (p.life < 0.15) {
                    p.opacity = (p.life / 0.15) * p.maxOpacity;
                } else {
                    p.opacity = p.maxOpacity;
                }

                if (p.y > petalCanvas.height + 80 || p.life <= 0) return false;

                if (petalImage.complete && petalImage.naturalWidth > 0) {
                    pctx.save();
                    pctx.globalAlpha = Math.max(0, p.opacity);
                    pctx.translate(p.x, p.y);
                    pctx.rotate(p.rotation * Math.PI / 180);
                    pctx.drawImage(petalImage, -p.size / 2, -p.size / 2, p.size, p.size);
                    pctx.restore();
                }
                return true;
            });
        }

        // 녹화 타이머 업데이트
        function updateRecordTimer() {
            const recorder = getArRecorder();
            if (!recorder) return;
            
            const elapsed = Date.now() - recorder.recordStartTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            recordTimeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            // 프로그레스 링 업데이트
            if (progressCircle) {
                const progress = Math.min(elapsed / MAX_RECORD_DURATION_MS, 1);
                const circumference = 2 * Math.PI * 45; // r=45
                progressCircle.style.strokeDashoffset = circumference * (1 - progress);
            }
            
            // 최대 시간 도달 시 자동 종료
            if (elapsed >= MAX_RECORD_DURATION_MS) {
                stopRecording();
            }
        }

        // 녹화 시작 (ar-recorder 컴포넌트 사용)
        function startRecording() {
            if (isRecording || isCapturing) return;
            
            const recorder = getArRecorder();
            if (!recorder) {
                showToast('녹화 준비 중...', '⏳');
                return;
            }
            
            // ar-recorder 컴포넌트로 녹화 시작
            recorder.startRecording(isSelfieMode);
            isRecording = true;
            
            // UI 업데이트
            captureBtn.classList.add('recording');
            captureBtn.classList.remove('pressing');
            recordTimer.classList.add('show');
            captureHint.classList.remove('show');
            
            // 타이머 시작
            progressCircle = captureBtn.querySelector('.progress-ring circle');
            if (progressCircle) {
                progressCircle.style.strokeDashoffset = '283';
            }
            recordTimerInterval = setInterval(updateRecordTimer, 100);
            
            // 진동 피드백
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        // 녹화 종료 (ar-recorder 컴포넌트 사용)
        function stopRecording() {
            const recorder = getArRecorder();
            if (!recorder || !isRecording) return;
            
            // ar-recorder 컴포넌트로 녹화 종료
            recorder.stopRecording();
            isRecording = false;
            
            // 타이머 중지
            if (recordTimerInterval) {
                clearInterval(recordTimerInterval);
                recordTimerInterval = null;
            }
            
            // UI 복원
            captureBtn.classList.remove('recording', 'pressing');
            recordTimer.classList.remove('show');
            
            // 프로그레스 링 리셋
            if (progressCircle) {
                progressCircle.style.strokeDashoffset = '283';
            }
            
            // 진동 피드백
            if (navigator.vibrate) {
                navigator.vibrate([50, 50, 50]);
            }
        }
        
        // ===== 터치 이벤트 핸들러 (인스타그램 스타일) =====
        function handlePointerDown(e) {
            if (isCapturing || isRecording) return;
            e.preventDefault();
            
            isPressing = true;
            pressStartTime = Date.now();
            
            // 버튼 누름 효과
            captureBtn.classList.add('pressing');
            captureHint.classList.remove('show');
            
            // 진동 피드백
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }
        
        function handlePointerUp(e) {
            if (!isPressing) return;
            e.preventDefault();
            
            const pressDuration = Date.now() - pressStartTime;
            isPressing = false;
            
            if (isRecording) {
                // 녹화 중이었으면 녹화 종료
                stopRecording();
            } else if (pressDuration < VIDEO_THRESHOLD_MS) {
                // 짧게 눌렀으면 사진 촬영
                captureBtn.classList.remove('pressing');
                takePhotoInstant();
            } else {
                // 녹화가 시작되지 않았는데 오래 눌렀다면 녹화 시작 (이미 startRecording에서 처리됨)
                captureBtn.classList.remove('pressing');
            }
        }
        
        function handlePointerCancel(e) {
            if (isPressing) {
                isPressing = false;
                captureBtn.classList.remove('pressing');
                if (isRecording) {
                    stopRecording();
                }
            }
        }
        
        // 길게 누르기 감지를 위한 타이머
        let longPressTimer = null;
        
        function setupCaptureButton() {
            captureBtn.addEventListener('pointerdown', (e) => {
                handlePointerDown(e);
                
                // 0.5초 후 녹화 시작
                longPressTimer = setTimeout(() => {
                    if (isPressing && !isRecording && !isCapturing) {
                        startRecording();
                    }
                }, VIDEO_THRESHOLD_MS);
            });
            
            captureBtn.addEventListener('pointerup', (e) => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                handlePointerUp(e);
            });
            
            captureBtn.addEventListener('pointercancel', (e) => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                handlePointerCancel(e);
            });
            
            captureBtn.addEventListener('pointerleave', (e) => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                if (isPressing && !isRecording) {
                    handlePointerCancel(e);
                }
            });
            
            // 컨텍스트 메뉴 방지
            captureBtn.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        // ===== 🔄 카메라 전환 (전면/후면) - MindAR 시스템 제어 =====
        function toggleCamera() {
            if (!arStarted) return;

            const arSystem = sceneEl.systems['mindar-image-system'];
            if (!arSystem) {
                showToast('AR 시스템이 준비되지 않았습니다', '⚠️');

            }

            cameraSwitchBtn.classList.add('switching');

            isSelfieMode = !isSelfieMode;
            currentFacingMode = isSelfieMode ? 'user' : 'environment';
            document.body.classList.toggle('selfie-mode', isSelfieMode);

            if (isSelfieMode) {
                // ── 후면 → 전면: MindAR 종료 + 독립 video 요소로 전면 카메라 표시 ──
                arSystem.stop();

                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
                })
                .then(stream => {
                    selfieStream = stream;

                    // MindAR의 video를 건드리지 않고 새 video 요소를 화면 위에 올림
                    let selfieVideo = document.getElementById('selfie-video');
                    if (!selfieVideo) {
                        selfieVideo = document.createElement('video');
                        selfieVideo.id = 'selfie-video';
                        selfieVideo.setAttribute('playsinline', '');
                        selfieVideo.setAttribute('autoplay', '');
                        selfieVideo.setAttribute('muted', '');
                        selfieVideo.style.cssText = `
                            position: fixed; top: 0; left: 0;
                            width: 100vw; height: 100vh;
                            object-fit: cover;
                            z-index: 2;
                            transform: scaleX(-1);
                            pointer-events: none;
                        `;
                        document.body.appendChild(selfieVideo);
                    }
                    selfieVideo.srcObject = stream;
                    selfieVideo.play().catch(() => {});

                    cameraSwitchBtn.classList.remove('switching');
                    showToast('📱 전면 카메라', '✅');
                    console.log('카메라 전환 완료: user (selfie, 독립 video)');
                })
                .catch(err => {
                    console.error('전면 카메라 요청 실패:', err);
                    isSelfieMode = false;
                    currentFacingMode = 'environment';
                    document.body.classList.remove('selfie-mode');
                    arSystem.start();
                    cameraSwitchBtn.classList.remove('switching');
                    showToast('카메라 전환에 실패했습니다.', '❌');
                });

            } else {
                // ── 전면 → 후면: 셀피 video/스트림 완전 제거 후 MindAR 재기동 ──
                if (selfieStream) {
                    selfieStream.getTracks().forEach(track => track.stop());
                    selfieStream = null;
                }
                const selfieVideo = document.getElementById('selfie-video');
                if (selfieVideo) selfieVideo.remove();

                arSystem.start();

                setTimeout(() => {
                    forceVideoExpose();

                    showToast('📷 후면 카메라', '✅');
                    console.log('카메라 전환 완료: environment');
                }, 500);
            }
        }

        // 꽃잎 폭발 (Canvas 2D)
        function createPetalBurst() {
            if (petalCanvas.style.display === 'none') {
                resizePetalCanvas();
                petalCanvas.style.display = 'block';
            }
            const cx = petalCanvas.width / 2, cy = petalCanvas.height / 2;
            for (let i = 0; i < 20; i++) {
                const angle = (i / 20) * 360 + (Math.random() - 0.5) * 40;
                const dist = 100 + Math.random() * 200;
                const speed = 4 + Math.random() * 5;
                const size = 25 + Math.random() * 20;
                petalParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle * Math.PI / 180) * speed,
                    vy: Math.sin(angle * Math.PI / 180) * speed,
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 15,
                    size, opacity: 1, maxOpacity: 1,
                    fadeIn: 1, life: 1, lifeDecay: 0.018
                });
            }
            if (!petalAnimId) animatePetals();
            // 전경 꽃잎이 없으면 버스트 끝난 뒤 캔버스 숨김
            setTimeout(() => {
                if (!fgPetalInterval) stopForegroundPetals();
            }, 2600);
        }
        
        // 레이어 사이에서 벚꽃이 뿜어져 나오는 이펙트 (kit 모드 전용)
        function createLayerBurst() {
            if (petalCanvas.style.display === 'none') {
                resizePetalCanvas();
                petalCanvas.style.display = 'block';
            }
            const cx = petalCanvas.width / 2;
            const cy = petalCanvas.height / 2;

            // 3겹 레이어의 깊이를 흉내낸 3단계 폭발 — 시간차로 뿜어냄
            const waves = [
                { delay: 0,    count: 8,  speedMin: 2, speedMax: 4, sizeMin: 18, sizeMax: 28, spread: 360 },  // 배경 레이어
                { delay: 180,  count: 12, speedMin: 4, speedMax: 7, sizeMin: 22, sizeMax: 35, spread: 360 },  // 중경 레이어
                { delay: 360,  count: 16, speedMin: 6, speedMax: 10, sizeMin: 28, sizeMax: 45, spread: 360 }, // 전경 레이어 — 가장 크고 빠름
            ];

            waves.forEach(wave => {
                setTimeout(() => {
                    for (let i = 0; i < wave.count; i++) {
                        const angle = (i / wave.count) * wave.spread + (Math.random() - 0.5) * 30;
                        const speed = wave.speedMin + Math.random() * (wave.speedMax - wave.speedMin);
                        const size  = wave.sizeMin  + Math.random() * (wave.sizeMax  - wave.sizeMin);
                        petalParticles.push({
                            x: cx + (Math.random() - 0.5) * 60,
                            y: cy + (Math.random() - 0.5) * 60,
                            vx: Math.cos(angle * Math.PI / 180) * speed,
                            vy: Math.sin(angle * Math.PI / 180) * speed,
                            rotation: Math.random() * 360,
                            rotSpeed: (Math.random() - 0.5) * 18,
                            size, opacity: 1, maxOpacity: 1,
                            fadeIn: 1, life: 1, lifeDecay: 0.012
                        });
                    }
                    if (!petalAnimId) animatePetals();
                }, wave.delay);
            });

            // 버스트 후 전경 꽃잎으로 전환 (fgPetalInterval이 없으면 약 3초 뒤 canvas 정리)
            setTimeout(() => {
                if (!fgPetalInterval) stopForegroundPetals();
            }, 3500);
        }

        // 마커 영역 추출
        function extractMarkerRegion() {
            if (!videoElement) return null;
            const vw = videoElement.videoWidth, vh = videoElement.videoHeight;
            if (vw === 0 || vh === 0) return null;
            // 레이어 PNG가 1:1 정사각형 → 정사각형 영역 추출
            const size = Math.min(vw, vh) * 0.78;
            return { x: Math.max(0, (vw - size) / 2), y: Math.max(0, (vh - size) / 2), width: size, height: size };
        }
        
        // 텍스처 스캔 및 색상 오버레이 적용
        function scanTexture(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            if (!videoElement || !isTargetFound) { showToast('도안을 카메라에 비춰주세요', '📷'); return false; }
            try {
                const region = extractMarkerRegion();
                if (!region) { showToast('도안 영역을 찾을 수 없습니다', '❌'); return false; }

                // 각 레이어별로 색칠본을 마스킹하여 개별 텍스처로 입힘
                [1, 2, 3].forEach(num => {
                    const canvas = document.getElementById(`canvas-layer${num}`);
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const layerImg = document.getElementById(`layer${num}`);
                    const cw = canvas.width, ch = canvas.height;

                    ctx.clearRect(0, 0, cw, ch);
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    // Step 1: 스캔한 비디오 색상을 캔버스에 복사
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.drawImage(videoElement, region.x, region.y, region.width, region.height, 0, 0, cw, ch);

                    // Step 2: 레이어 PNG의 알파 채널로 색칠 영역 마스킹 (오려내기)
                    ctx.globalCompositeOperation = 'destination-in';
                    ctx.drawImage(layerImg, 0, 0, cw, ch);

                    // Step 3: 원본 도안의 선(테두리)을 multiply로 덧그려 색감 살리기
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(layerImg, 0, 0, cw, ch);

                    ctx.globalCompositeOperation = 'source-over';

                    // Step 4: 마스킹된 캔버스를 해당 레이어 평면의 텍스처로 주입
                    const plane = document.getElementById(`diorama-layer${num}`);
                    if (plane) {
                        plane.setAttribute('material', `src: #canvas-layer${num}; shader: flat; transparent: true; alphaTest: 0.1; side: double;`);
                        if (plane.components.material && plane.components.material.material && plane.components.material.material.map) {
                            plane.components.material.material.map.needsUpdate = true;
                        }
                    }
                });

                // 프리뷰는 레이어1 캔버스 기준으로 표시
                texturePreview.src = document.getElementById('canvas-layer1').toDataURL('image/jpeg', 0.9);
                texturePreview.classList.add('show');
                isTextureScanned = true;
                scanButton.textContent = '✅ 스캔 완료!';
                scanButton.classList.add('scanned');

                captureBtn.style.display = 'block';
                captureHint.classList.add('show');
                setTimeout(() => captureHint.classList.remove('show'), 4000);

                showToast('🌸 도안이 성공적으로 스캔되었습니다!', '✨');
                createPetalBurst();
                return true;
            } catch (e) { console.error(e); showToast('스캔 중 오류가 발생했습니다', '❌'); return false; }
        }

        // 모드 시작 함수
        async function startMode(mode) {
            console.log('🚀 startMode 호출:', mode);
            currentMode = mode;
            startMenu.classList.add('hidden');
            showLoadingScreen();
            
            // 씬 표시 (먼저 표시해야 시스템이 초기화됨)
            sceneEl.style.display = 'block';

            // 모바일 캔버스 0x0 렌더링 버그 강제 해결
            // display:none 상태에서 켤 때 모바일 브라우저가 캔버스 크기를 0으로 유지하는 문제 방지
            setTimeout(() => {
                if (sceneEl.resize) sceneEl.resize();
                window.dispatchEvent(new Event('resize'));
            }, 200);

            // AR 시작 (시스템 로드 대기)
            if (!arStarted) {
                try {
                    console.log('⏳ 씬 로드 대기 중...');
                    
                    // 씬이 로드될 때까지 대기
                    if (!sceneEl.hasLoaded) {
                        await new Promise((resolve) => {
                            sceneEl.addEventListener('loaded', resolve, { once: true });
                        });
                        console.log('✅ 씬 로드 완료');
                    }
                    
                    console.log('⏳ MindAR 시스템 대기 중...');
                    
                    // MindAR 시스템이 준비될 때까지 대기
                    const waitForSystem = () => {
                        return new Promise((resolve, reject) => {
                            let attempts = 0;
                            const maxAttempts = 100; // 10초 (100ms × 100)
                            
                            const checkSystem = () => {
                                attempts++;
                                if (attempts % 10 === 0) {
                                    console.log(`🔍 시스템 체크 ${attempts}/${maxAttempts}`);
                                }
                                
                                if (sceneEl.systems && sceneEl.systems['mindar-image-system']) {
                                    resolve();
                                } else if (attempts >= maxAttempts) {
                                    reject(new Error('MindAR 시스템 로드 타임아웃'));
                                } else {
                                    setTimeout(checkSystem, 100);
                                }
                            };
                            checkSystem();
                        });
                    };
                    
                    await waitForSystem();
                    console.log('✅ MindAR 시스템 발견, 시작 중...');
                    sceneEl.systems['mindar-image-system'].start();
                    arStarted = true;
                    console.log('✅ MindAR 시스템 시작 완료');
                } catch (err) {
                    console.error('❌ MindAR 시작 실패:', err);
                    hideLoadingScreen();
                    showError('AR 초기화 실패', '카메라 권한을 확인하고 다시 시도해주세요.');
                    return;
                }
            }
            
            // 공통 UI 표시
            backButton.classList.add('show');
            warmOverlay.classList.add('show');
            
            if (mode === 'blossom') {
                // 벚꽃 모드: diorama 레이어 완전 숨김
                if (dioramaLayer1) dioramaLayer1.setAttribute('visible', 'false');
                if (dioramaLayer2) dioramaLayer2.setAttribute('visible', 'false');
                if (dioramaLayer3) dioramaLayer3.setAttribute('visible', 'false');

                // 벚꽃 모드: 바로 카메라 + 꽃잎 + 촬영 버튼
                setTimeout(() => {
                    hideLoadingScreen();
                    forceVideoExpose();
                    fixBlackScreen();
                    
                    // 카메라 앞 꽃잎 표시
                    if (cameraPetals) cameraPetals.setAttribute('visible', 'true');
                    
                    // 화면 전체 꽃잎 시작
                    startForegroundPetals();
                    
                    // 인스타그램 스타일 촬영 버튼 표시
                    buttonContainer.classList.add('show');
                    captureBtn.style.display = 'block';
                    scanButton.classList.remove('show');
                    
                    // 카메라 전환 버튼 표시
                    cameraSwitchBtn.classList.add('show');
                    
                    // 촬영 힌트 표시 (3초 후 사라짐)
                    captureHint.classList.add('show');
                    setTimeout(() => captureHint.classList.remove('show'), 4000);
                    
                    showToast('🌸 탭: 사진 | 길게 누르기: 동영상', '📸');
                }, 1000);
                
            } else if (mode === 'kit') {
                // 키트 모드: 가이드 표시 후 마커 인식 대기
                setTimeout(() => {
                    hideLoadingScreen();
                    forceVideoExpose();
                    fixBlackScreen();
                    
                    // 가이드 표시
                    showGuide();

                    // 전경 꽃잎 애니메이션 시작
                    startForegroundPetals();
                    
                    // 버튼 컨테이너 표시 (스캔 버튼은 마커 인식 후)
                    buttonContainer.classList.add('show');
                    scanButton.classList.remove('show');
                    captureBtn.style.display = 'none';
                    
                    // 카메라 전환 버튼 표시
                    cameraSwitchBtn.classList.add('show');
                    
                    showToast('📷 색칠한 도안을 카메라에 비춰주세요', '🎨');
                }, 1000);
            }
        }
        
        // 시작 메뉴 버튼 이벤트
        btnModeBlossom.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startMode('blossom');
        });
        
        btnModeKit.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startMode('kit');
        });
        
        // A-Frame 이벤트
        sceneEl.addEventListener('loaded', () => {
            if (sceneEl.renderer) {
                // 투명 배경 설정
                sceneEl.renderer.setClearColor(0x000000, 0);
                
                // [핵심] WebGL 캡처를 위한 설정 확인
                const gl = sceneEl.renderer.getContext();
                const attrs = gl.getContextAttributes();
                console.log('🎨 WebGL Context 설정:', {
                    preserveDrawingBuffer: attrs.preserveDrawingBuffer,
                    alpha: attrs.alpha,
                    premultipliedAlpha: attrs.premultipliedAlpha,
                    antialias: attrs.antialias
                });
                
                // premultipliedAlpha 확인 (false여야 파티클이 제대로 캡처됨)
                if (attrs.premultipliedAlpha !== false) {
                    console.warn('⚠️ premultipliedAlpha가 false가 아닙니다. 파티클 캡처에 문제가 있을 수 있습니다.');
                }
            }
        });
        
        sceneEl.addEventListener('arReady', () => {
            hideLoadingScreen();
            forceVideoExpose();
            fixBlackScreen();
            setTimeout(fixBlackScreen, 500);
            setTimeout(fixBlackScreen, 1000);
        });
        
        sceneEl.addEventListener('arError', (e) => {
            console.error('AR Error:', e);
            showError('AR 초기화 실패', '카메라 접근 권한을 확인해주세요.\n또는 HTTPS 환경에서 실행해주세요.');
        });
        
        // 마커 인식 (키트 모드에서만 사용)
        arTarget.addEventListener('targetFound', () => {
            isTargetFound = true; 
            isTargetVisible = true;
            
            if (lostTimeout) { 
                clearTimeout(lostTimeout); 
                lostTimeout = null; 
            }
            
            if (currentMode === 'kit') {
                hideGuide(); 
                showStatus('🌸 도안 인식 완료!');
                if (!isTextureScanned) scanButton.classList.add('show');
                if (petalsContainer) petalsContainer.setAttribute('visible', 'true');
                if (dioramaLayer1) dioramaLayer1.setAttribute('visible', 'true');
                if (dioramaLayer2) dioramaLayer2.setAttribute('visible', 'true');
                if (dioramaLayer3) dioramaLayer3.setAttribute('visible', 'true');
                if (!hasExploded && isTextureScanned) {
                    createLayerBurst();
                    hasExploded = true; 
                }
            } else {
                // blossom 모드에서는 diorama 레이어 숨김
                if (dioramaLayer1) dioramaLayer1.setAttribute('visible', 'false');
                if (dioramaLayer2) dioramaLayer2.setAttribute('visible', 'false');
                if (dioramaLayer3) dioramaLayer3.setAttribute('visible', 'false');
            }
        });
        
        arTarget.addEventListener('targetLost', () => {
            isTargetFound = false;
            if (lostTimeout) clearTimeout(lostTimeout);
            lostTimeout = setTimeout(() => {
                if (!isTargetFound && currentMode === 'kit') { 
                    isTargetVisible = false; 
                    showGuide(); 
                    showStatus('📷 도안을 다시 비춰주세요');
                    if (petalsContainer) petalsContainer.setAttribute('visible', 'false'); 
                }
            }, TRACKING_PERSISTENCE_MS);
        });
        
        // 초기화
        window.onload = function() {
            // 씬 숨김 상태 유지 (시작 메뉴 먼저)
            sceneEl.style.display = 'none';
        };
        
        console.log('🌸 벚꽃 터널 AR 포토존 준비 완료 (인스타그램 스타일 촬영 시스템, 사진/영상 통합, 셀카 모드 지원)');
    </script>
</body>
</html>
