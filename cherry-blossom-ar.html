<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- HTTPS 카메라 권한을 위한 메타 태그 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffb6c1">
    
    <!-- SEO Meta Tags -->
    <title>🌸 벚꽃 터널 AR 포토존 | Epispace</title>
    <meta name="description" content="직접 색칠한 도안이 AR로 살아나는 벚꽃 터널 포토존을 체험하세요. 앱 설치 없이 브라우저에서 바로!">
    <meta name="keywords" content="벚꽃AR, 포토존, AR체험, 에피스페이스, Epispace, 증강현실">
    
    <!-- Open Graph -->
    <meta property="og:title" content="🌸 벚꽃 터널 AR 포토존 | Epispace">
    <meta property="og:description" content="직접 색칠한 도안이 AR로 살아나는 특별한 체험!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://epispace.kr/cherry-blossom-ar.html">
    
    <!-- A-Frame & MindAR (독립적으로 로드) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: -100 !important;
            opacity: 1 !important;
            visibility: visible !important;
            display: block !important;
            background: transparent !important;
            pointer-events: none !important;
        }
        
        a-scene {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
            background: transparent !important;
        }
        
        .a-canvas {
            background: transparent !important;
            background-color: transparent !important;
        }
        
        /* 시작 메뉴 */
        #start-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d1f3d 0%, #1a1a2e 50%, #2d1f3d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 30px;
        }
        
        #start-menu.hidden {
            display: none;
        }
        
        .start-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffb6c1;
            text-shadow: 0 0 30px rgba(255, 182, 193, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }
        
        .start-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            text-align: center;
        }
        
        .mode-btn {
            width: 280px;
            padding: 22px 30px;
            margin: 10px 0;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        .mode-btn:active {
            transform: scale(0.97);
        }
        
        #btn-mode-blossom {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            color: white;
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.4);
        }
        
        #btn-mode-blossom .mode-desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.9;
        }
        
        #btn-mode-kit {
            background: linear-gradient(135deg, #9c27b0 0%, #e91e63 100%);
            color: white;
            box-shadow: 0 8px 30px rgba(156, 39, 176, 0.4);
        }
        
        #btn-mode-kit .mode-desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.9;
        }
        
        .start-footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        
        /* 에러 오버레이 */
        #error-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            color: white;
            text-align: center;
            padding: 30px;
        }
        
        #error-overlay.show { display: flex; }
        
        #error-overlay .error-icon { font-size: 60px; margin-bottom: 20px; }
        #error-overlay .error-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; color: #ff6b9d; }
        #error-overlay .error-message { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.6; }
        #error-overlay .retry-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* 뒤로가기 버튼 */
        #back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        #back-button.show { display: flex; }
        #back-button:active { transform: scale(0.95); }
        
        /* 따뜻한 톤 오버레이 */
        #warm-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                180deg,
                rgba(255, 200, 180, 0.08) 0%,
                rgba(255, 180, 200, 0.05) 50%,
                rgba(255, 200, 180, 0.08) 100%
            );
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: soft-light;
            display: none;
        }
        
        #warm-overlay.show { display: block; }
        
        /* 셔터 플래시 */
        #shutter-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
        }
        
        #shutter-flash.flash { animation: shutterFlash 0.4s ease-out; }
        
        @keyframes shutterFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* 가이드 UI */
        #guide-ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }
        
        #guide-ui.show { display: flex; }
        #guide-ui.hidden { opacity: 0; pointer-events: none; }
        
        #guide-image {
            width: 55vmin;
            max-width: 260px;
            object-fit: contain;
            opacity: 0.55;
            filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.6));
            animation: guidePulse 2.5s ease-in-out infinite;
        }
        
        @keyframes guidePulse {
            0%, 100% { transform: scale(1); opacity: 0.55; }
            50% { transform: scale(1.02); opacity: 0.65; }
        }
        
        #guide-text {
            margin-top: 24px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.45);
            padding: 12px 24px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        
        /* 로딩 화면 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d1f3d 0%, #1a1a2e 50%, #2d1f3d 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease-out;
        }
        
        #loading-screen.show { display: flex; }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        
        .loading-spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255, 182, 193, 0.3);
            border-top-color: #ffb6c1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text {
            margin-top: 20px;
            color: #ffb6c1;
            font-size: 15px;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
        }
        
        .loading-subtitle {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }
        
        /* 버튼 컨테이너 */
        #button-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            z-index: 300;
            transition: opacity 0.3s ease;
        }
        
        #button-container.show { display: flex; }
        #button-container.hidden { opacity: 0; pointer-events: none; }
        
        /* 공통 버튼 스타일 */
        .ar-btn {
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }
        
        .ar-btn:active { transform: scale(0.95); }
        .ar-btn.show { display: block; animation: buttonPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        #scan-button {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            box-shadow: 0 6px 25px rgba(255, 107, 157, 0.5);
        }
        
        #scan-button.scanned {
            background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
        }
        
        #photo-capture-button {
            background: linear-gradient(135deg, #9c27b0 0%, #e91e63 100%);
            box-shadow: 0 6px 25px rgba(156, 39, 176, 0.5);
        }
        
        @keyframes buttonPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 카운트다운 */
        #photo-countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 800;
            color: white;
            text-shadow: 
                0 0 60px rgba(255, 182, 193, 0.9),
                0 0 100px rgba(255, 107, 157, 0.6),
                0 6px 30px rgba(0,0,0,0.4);
            z-index: 600;
            opacity: 0;
            pointer-events: none;
        }
        
        #photo-countdown.show {
            animation: countdownPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes countdownPop {
            0% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        /* 토스트 */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px 30px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            z-index: 500;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        #toast .icon { font-size: 40px; display: block; margin-bottom: 10px; }
        
        /* 상태바 */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            color: white;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(255, 107, 157, 0.5);
        }
        
        #status-bar.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        #status-bar.hidden { opacity: 0 !important; }
        
        /* 전경 꽃잎 */
        #foreground-petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 400;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        
        #foreground-petals.show { display: block; }
        
        .fg-petal {
            position: absolute;
            background-image: url('./assets/cherry-blossom-ar/petal.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0;
            will-change: transform, opacity;
        }
        
        @keyframes petalFloat {
            0% { opacity: 0; transform: translate(0, -50px) rotate(0deg) scale(var(--scale)); }
            8% { opacity: var(--opacity); }
            25% { transform: translate(var(--drift1), 25vh) rotate(90deg) scale(var(--scale)); }
            50% { transform: translate(var(--drift2), 50vh) rotate(180deg) scale(var(--scale)); }
            75% { transform: translate(var(--drift3), 75vh) rotate(270deg) scale(var(--scale)); }
            92% { opacity: var(--opacity); }
            100% { opacity: 0; transform: translate(var(--drift4), 110vh) rotate(360deg) scale(var(--scale)); }
        }
        
        /* 버스트 꽃잎 */
        #screen-petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
            overflow: hidden;
        }
        
        .burst-petal {
            position: absolute;
            background-image: url('./assets/cherry-blossom-ar/petal.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0;
        }
        
        @keyframes petalBurst {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(0.2); }
            30% { opacity: 1; transform: translate(calc(var(--tx) * 0.5), calc(var(--ty) * 0.5)) rotate(calc(var(--rot) * 0.3)) scale(1.3); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.8); }
        }
        
        /* 텍스처 프리뷰 */
        #texture-preview {
            position: fixed;
            bottom: 100px;
            right: 15px;
            width: 70px;
            height: 70px;
            border: 3px solid rgba(255, 182, 193, 0.8);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
            z-index: 250;
            display: none;
            object-fit: cover;
            transition: opacity 0.3s ease;
            image-rendering: -webkit-optimize-contrast;
        }
        
        #texture-preview.show { display: block; animation: previewPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #texture-preview.hidden { opacity: 0; pointer-events: none; }
        
        @keyframes previewPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 미리보기 모달 */
        #capture-preview-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        #capture-preview-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #capture-preview-image {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 16px;
            box-shadow: 0 10px 50px rgba(255, 182, 193, 0.3);
            image-rendering: -webkit-optimize-contrast;
        }
        
        #capture-preview-info {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }
        
        #capture-preview-close {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a65 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* 캔버스 숨김 */
        #paint-canvas, #hires-canvas { display: none; }
    </style>
</head>
<body>
    <!-- 시작 메뉴 -->
    <div id="start-menu">
        <h1 class="start-title">🌸 벚꽃 터널 AR</h1>
        <p class="start-subtitle">체험 모드를 선택해주세요</p>
        
        <button type="button" id="btn-mode-blossom" class="mode-btn">
            🌸 벚꽃이랑 촬영하기
            <span class="mode-desc">바로 카메라와 벚꽃잎으로 사진 촬영</span>
        </button>
        
        <button type="button" id="btn-mode-kit" class="mode-btn">
            🎨 색칠 키트 체험하기
            <span class="mode-desc">색칠한 도안을 스캔해서 AR로 보기</span>
        </button>
        
        <p class="start-footer">Epispace AR Experience</p>
    </div>
    
    <!-- 에러 오버레이 -->
    <div id="error-overlay">
        <span class="error-icon">⚠️</span>
        <p class="error-title">리소스 로드 실패</p>
        <p class="error-message" id="error-message">필요한 파일을 불러오지 못했습니다.</p>
        <button type="button" class="retry-btn" onclick="location.reload()">다시 시도</button>
    </div>
    
    <!-- 뒤로가기 버튼 -->
    <button type="button" id="back-button">←</button>
    
    <!-- 셔터 플래시 -->
    <div id="shutter-flash"></div>
    
    <!-- 따뜻한 톤 오버레이 -->
    <div id="warm-overlay"></div>
    
    <div id="status-bar">🌸 도안 인식 완료!</div>
    
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <p class="loading-text">🌸 벚꽃 터널 포토존</p>
        <p class="loading-subtitle">카메라를 준비하고 있어요...</p>
    </div>
    
    <div id="guide-ui">
        <img id="guide-image" src="./assets/cherry-blossom-ar/guide.png" alt="가이드">
        <p id="guide-text">도안을 프레임에 맞춰주세요 🌸</p>
    </div>
    
    <div id="foreground-petals"></div>
    <div id="screen-petals"></div>
    
    <div id="button-container">
        <button type="button" id="scan-button" class="ar-btn">🎨 색칠 완료! AR 보기</button>
        <button type="button" id="photo-capture-button" class="ar-btn">📸 사진 찍기</button>
    </div>
    
    <div id="photo-countdown"></div>
    
    <div id="toast">
        <span class="icon">✨</span>
        <span class="message">도안이 성공적으로 스캔되었습니다!</span>
    </div>
    
    <img id="texture-preview" alt="캡처된 텍스처">
    
    <div id="capture-preview-modal">
        <img id="capture-preview-image" alt="촬영된 사진">
        <p id="capture-preview-info">고화질 (0 x 0)</p>
        <button type="button" id="capture-preview-close">확인</button>
    </div>
    
    <canvas id="paint-canvas" width="1024" height="1024"></canvas>
    <canvas id="hires-canvas"></canvas>
    
    <!-- A-Frame AR 씬 -->
    <a-scene
        id="ar-scene"
        mindar-image="imageTargetSrc: ./assets/cherry-blossom-ar/target.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.00001; filterBeta: 0.0001; missTolerance: 20; warmupTolerance: 10;"
        color-space="sRGB"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
        style="display: none;"
    >
        <a-assets timeout="10000">
            <img id="petal-img" src="./assets/cherry-blossom-ar/petal.png" crossorigin="anonymous">
            <img id="relief-flat-img" src="./assets/cherry-blossom-ar/relief_flat.png" crossorigin="anonymous">
        </a-assets>
        
        <a-entity light="type: ambient; color: #fff5f0; intensity: 1.3;"></a-entity>
        <a-entity light="type: directional; color: #fff8f5; intensity: 0.9;" position="0 3 2"></a-entity>
        <a-entity light="type: directional; color: #ffe4e1; intensity: 0.6;" position="-2 2 -1"></a-entity>
        <a-entity light="type: directional; color: #ffeef0; intensity: 0.4;" position="2 1 1"></a-entity>
        
        <a-camera position="0 0 0" look-controls="enabled: false">
            <!-- 카메라 앞 벚꽃 파티클 (Free Mode용) -->
            <a-entity id="camera-petals" visible="false">
                <a-image src="#petal-img" position="-0.3 0.2 -1" scale="0.08 0.08 0.08" opacity="0.8"
                    animation__fall="property: position; from: -0.3 0.5 -1; to: 0.3 -0.5 -1.2; dur: 4000; easing: easeInOutSine; loop: true;"
                    animation__rotate="property: rotation; from: 0 0 0; to: 45 180 360; dur: 4500; easing: linear; loop: true;">
                </a-image>
                <a-image src="#petal-img" position="0.25 0.15 -0.8" scale="0.06 0.06 0.06" opacity="0.7"
                    animation__fall="property: position; from: 0.4 0.4 -0.8; to: -0.4 -0.4 -1; dur: 5000; easing: easeInOutSine; loop: true; delay: 500;"
                    animation__rotate="property: rotation; from: 30 0 45; to: -30 360 405; dur: 5500; easing: linear; loop: true;">
                </a-image>
                <a-image src="#petal-img" position="0.1 -0.1 -1.2" scale="0.1 0.1 0.1" opacity="0.85"
                    animation__fall="property: position; from: -0.2 0.6 -1.2; to: 0.2 -0.6 -1.4; dur: 4500; easing: easeInOutSine; loop: true; delay: 1000;"
                    animation__rotate="property: rotation; from: -20 0 -30; to: 20 -360 330; dur: 5000; easing: linear; loop: true;">
                </a-image>
                <a-image src="#petal-img" position="-0.15 0.3 -0.9" scale="0.07 0.07 0.07" opacity="0.75"
                    animation__fall="property: position; from: 0.3 0.5 -0.9; to: -0.3 -0.5 -1.1; dur: 3800; easing: easeInOutSine; loop: true; delay: 300;"
                    animation__rotate="property: rotation; from: 10 20 0; to: -10 380 360; dur: 4200; easing: linear; loop: true;">
                </a-image>
                <a-image src="#petal-img" position="0.35 0.05 -1.1" scale="0.055 0.055 0.055" opacity="0.65"
                    animation__fall="property: position; from: 0.35 0.45 -1.1; to: -0.35 -0.45 -1.3; dur: 5500; easing: easeInOutSine; loop: true; delay: 700;"
                    animation__rotate="property: rotation; from: -15 30 20; to: 15 390 380; dur: 6000; easing: linear; loop: true;">
                </a-image>
            </a-entity>
        </a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
            <!-- 2D 이미지 기반 평면 (부조 도안) -->
            <a-plane
                id="relief-plane"
                position="0 0 0.01"
                width="1"
                height="0.667"
                material="shader: flat; src: #relief-flat-img; transparent: true; opacity: 1; side: double;"
                animation="property: position; from: 0 -0.05 0.01; to: 0 0.05 0.01; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;"
            ></a-plane>
            
            <!-- 색상 오버레이 평면 (스캔한 색상을 합성) -->
            <a-plane
                id="color-overlay-plane"
                position="0 0 0.02"
                width="1"
                height="0.667"
                material="shader: flat; color: #ffffff; transparent: true; opacity: 0; side: double; blending: normal;"
                animation="property: position; from: 0 -0.05 0.02; to: 0 0.05 0.02; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;"
                visible="false"
            ></a-plane>
            
            <a-entity light="type: point; color: #ffb6c1; intensity: 0.8; distance: 2; decay: 1.5;" position="0.3 0.2 0.3"></a-entity>
            <a-entity light="type: point; color: #ffc0cb; intensity: 0.6; distance: 1.5; decay: 1.5;" position="-0.3 0.1 0.2"></a-entity>
            
            <a-entity id="petals-container" visible="false">
                <a-image src="#petal-img" position="0 0.6 0.03" scale="0.18 0.18 0.18" opacity="0.9"
                    animation__fall="property: position; from: 0.4 1.5 0.03; to: -0.4 -1.5 0.03; dur: 5500; easing: easeInOutSine; loop: true;"
                    animation__rotate="property: rotation; from: 0 0 0; to: 45 180 720; dur: 6000; easing: linear; loop: true;">
                </a-image>
                <a-image src="#petal-img" position="-0.5 0.4 0.03" scale="0.14 0.14 0.14" opacity="0.85"
                    animation__fall="property: position; from: -0.6 1.3 0.03; to: 0.6 -1.3 0.03; dur: 6000; easing: easeInOutSine; loop: true; delay: 400;"
                    animation__rotate="property: rotation; from: 30 0 45; to: -30 360 765; dur: 7000; easing: linear; loop: true;">
                </a-image>
                <a-image src="#petal-img" position="0.5 0.3 0.03" scale="0.12 0.12 0.12" opacity="0.8"
                    animation__fall="property: position; from: 0.7 1.2 0.03; to: -0.7 -1.2 0.03; dur: 5000; easing: easeInOutSine; loop: true; delay: 800;"
                    animation__rotate="property: rotation; from: -20 0 -30; to: 20 -360 -750; dur: 5500; easing: linear; loop: true;">
                </a-image>
            </a-entity>
        </a-entity>
    </a-scene>
    
    <script>
        // 설정
        const CAPTURE_SCALE_MULTIPLIER = 2;
        const MIN_CAPTURE_WIDTH = 2048;
        const JPEG_QUALITY = 0.95;
        const TRACKING_PERSISTENCE_MS = 10000;
        const COUNTDOWN_SECONDS = 5;
        const FG_PETAL_INTERVAL = 300;
        
        // 현재 모드
        let currentMode = null; // 'blossom' or 'kit'
        
        // DOM 요소
        const startMenu = document.getElementById('start-menu');
        const btnModeBlossom = document.getElementById('btn-mode-blossom');
        const btnModeKit = document.getElementById('btn-mode-kit');
        const loadingScreen = document.getElementById('loading-screen');
        const guideUI = document.getElementById('guide-ui');
        const arTarget = document.getElementById('ar-target');
        const sceneEl = document.getElementById('ar-scene');
        const reliefPlane = document.getElementById('relief-plane');
        const colorOverlayPlane = document.getElementById('color-overlay-plane');
        const petalsContainer = document.getElementById('petals-container');
        const cameraPetals = document.getElementById('camera-petals');
        const paintCanvas = document.getElementById('paint-canvas');
        const paintCtx = paintCanvas.getContext('2d', { willReadFrequently: true });
        const hiresCanvas = document.getElementById('hires-canvas');
        const hiresCtx = hiresCanvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');
        const screenPetals = document.getElementById('screen-petals');
        const foregroundPetals = document.getElementById('foreground-petals');
        const scanButton = document.getElementById('scan-button');
        const photoCaptureButton = document.getElementById('photo-capture-button');
        const buttonContainer = document.getElementById('button-container');
        const photoCountdown = document.getElementById('photo-countdown');
        const toast = document.getElementById('toast');
        const texturePreview = document.getElementById('texture-preview');
        const shutterFlash = document.getElementById('shutter-flash');
        const warmOverlay = document.getElementById('warm-overlay');
        const capturePreviewModal = document.getElementById('capture-preview-modal');
        const capturePreviewImage = document.getElementById('capture-preview-image');
        const capturePreviewInfo = document.getElementById('capture-preview-info');
        const capturePreviewClose = document.getElementById('capture-preview-close');
        const errorOverlay = document.getElementById('error-overlay');
        const errorMessage = document.getElementById('error-message');
        const backButton = document.getElementById('back-button');
        
        let videoElement = null;
        let isTargetFound = false;
        let isTargetVisible = false;
        let staticTexture = null;
        let isTextureScanned = false;
        let fgPetalInterval = null;
        let hasExploded = false;
        let lostTimeout = null;
        let isCapturing = false;
        let audioContext = null;
        let resourcesLoaded = false;
        let arStarted = false;
        let petalImage = new Image();
        petalImage.crossOrigin = 'anonymous';
        petalImage.src = './assets/cherry-blossom-ar/petal.png';
        
        // 에러 표시 함수
        function showError(title, message) {
            const titleEl = errorOverlay.querySelector('.error-title');
            if (titleEl) titleEl.textContent = title;
            errorMessage.textContent = message;
            errorOverlay.classList.add('show');
        }
        
        // 검은 화면 수정 함수
        function fixBlackScreen() {
            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
                video.style.cssText = `
                    position: fixed !important;
                    top: 0 !important;
                    left: 0 !important;
                    width: 100vw !important;
                    height: 100vh !important;
                    object-fit: cover !important;
                    z-index: -100 !important;
                    opacity: 1 !important;
                    visibility: visible !important;
                    display: block !important;
                    background: transparent !important;
                `;
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('muted', '');
                if (video.paused) {
                    video.play().catch(() => {});
                }
                videoElement = video;
            });
            
            const canvases = document.querySelectorAll('canvas.a-canvas, .a-canvas');
            canvases.forEach(canvas => {
                canvas.style.background = 'transparent';
                canvas.style.backgroundColor = 'transparent';
            });
            
            if (sceneEl) {
                sceneEl.style.background = 'transparent';
                sceneEl.style.backgroundColor = 'transparent';
            }
            
            document.body.style.background = 'transparent';
            document.body.style.backgroundColor = 'transparent';
            
            if (sceneEl && sceneEl.renderer) {
                sceneEl.renderer.setClearColor(0x000000, 0);
            }
        }
        
        // 비디오 노출 강제
        function forceVideoExpose() {
            const video = document.querySelector('video');
            if (video) {
                video.style.cssText = `
                    position: fixed !important;
                    top: 0 !important;
                    left: 0 !important;
                    width: 100vw !important;
                    height: 100vh !important;
                    object-fit: cover !important;
                    z-index: -100 !important;
                    opacity: 1 !important;
                    visibility: visible !important;
                    display: block !important;
                `;
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('muted', '');
                videoElement = video;
                return true;
            }
            return false;
        }
        
        // 찰칵 소리
        function createShutterSound() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(800, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.15);
        }
        
        // 전경 꽃잎
        function createForegroundPetal() {
            const petal = document.createElement('div');
            petal.className = 'fg-petal';
            const sv = Math.random();
            let size, opacity, duration;
            if (sv < 0.3) { size = 12 + Math.random() * 8; opacity = 0.3 + Math.random() * 0.2; duration = 8 + Math.random() * 4; }
            else if (sv < 0.7) { size = 20 + Math.random() * 15; opacity = 0.5 + Math.random() * 0.25; duration = 6 + Math.random() * 3; }
            else { size = 35 + Math.random() * 20; opacity = 0.7 + Math.random() * 0.25; duration = 4 + Math.random() * 2; }
            petal.style.cssText = `left:${Math.random()*100}vw;top:-60px;width:${size}px;height:${size}px;--scale:${0.8+Math.random()*0.4};--opacity:${opacity};--drift1:${(Math.random()-0.5)*100}px;--drift2:${(Math.random()-0.5)*150}px;--drift3:${(Math.random()-0.5)*100}px;--drift4:${(Math.random()-0.5)*80}px;animation:petalFloat ${duration}s ease-in-out forwards;`;
            foregroundPetals.appendChild(petal);
            setTimeout(() => petal.remove(), (duration + 1) * 1000);
        }
        
        function startForegroundPetals() {
            if (fgPetalInterval) return;
            foregroundPetals.classList.add('show');
            for (let i = 0; i < 8; i++) setTimeout(() => createForegroundPetal(), i * 200);
            fgPetalInterval = setInterval(createForegroundPetal, FG_PETAL_INTERVAL);
        }
        
        function stopForegroundPetals() {
            if (fgPetalInterval) {
                clearInterval(fgPetalInterval);
                fgPetalInterval = null;
            }
            foregroundPetals.classList.remove('show');
        }
        
        // UI
        function hideLoadingScreen() {
            loadingScreen.classList.add('hidden');
            setTimeout(() => loadingScreen.classList.remove('show'), 600);
        }
        function showLoadingScreen() {
            loadingScreen.classList.add('show');
            loadingScreen.classList.remove('hidden');
        }
        function hideGuide() { guideUI.classList.add('hidden'); }
        function showGuide() { 
            guideUI.classList.add('show');
            guideUI.classList.remove('hidden'); 
        }
        function showStatus(msg) {
            if (isCapturing) return;
            statusBar.textContent = msg;
            statusBar.classList.add('show');
            setTimeout(() => statusBar.classList.remove('show'), 2500);
        }
        function showToast(message, icon = '✨') {
            if (isCapturing) return;
            toast.querySelector('.icon').textContent = icon;
            toast.querySelector('.message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        function hideAllUI() {
            buttonContainer.classList.add('hidden');
            texturePreview.classList.add('hidden');
            statusBar.classList.add('hidden');
            guideUI.classList.add('hidden');
            warmOverlay.classList.remove('show');
            foregroundPetals.classList.remove('show');
        }
        function showAllUI() {
            buttonContainer.classList.remove('hidden');
            texturePreview.classList.remove('hidden');
            statusBar.classList.remove('hidden');
            warmOverlay.classList.add('show');
            if (currentMode === 'blossom') {
                foregroundPetals.classList.add('show');
            }
        }
        
        // 고화질 캡처
        async function captureHighResolution() {
            if (!videoElement || !sceneEl) return null;
            try {
                const renderer = sceneEl.renderer;
                const dpr = window.devicePixelRatio || 1;
                const scale = Math.max(CAPTURE_SCALE_MULTIPLIER * dpr, MIN_CAPTURE_WIDTH / window.innerWidth);
                const cw = Math.floor(window.innerWidth * scale);
                const ch = Math.floor(window.innerHeight * scale);
                hiresCanvas.width = cw;
                hiresCanvas.height = ch;
                hiresCtx.imageSmoothingEnabled = true;
                hiresCtx.imageSmoothingQuality = 'high';
                
                const vw = videoElement.videoWidth, vh = videoElement.videoHeight;
                if (vw > 0 && vh > 0) {
                    const va = vw / vh, ca = cw / ch;
                    let sx, sy, sw, sh;
                    if (va > ca) { sh = vh; sw = vh * ca; sx = (vw - sw) / 2; sy = 0; }
                    else { sw = vw; sh = vw / ca; sx = 0; sy = (vh - sh) / 2; }
                    hiresCtx.drawImage(videoElement, sx, sy, sw, sh, 0, 0, cw, ch);
                }
                
                const origSize = renderer.getSize(new THREE.Vector2());
                const origPR = renderer.getPixelRatio();
                renderer.setPixelRatio(1);
                renderer.setSize(cw, ch, false);
                sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
                hiresCtx.drawImage(renderer.domElement, 0, 0, cw, ch);
                renderer.setPixelRatio(origPR);
                renderer.setSize(origSize.x, origSize.y, false);
                
                const grad = hiresCtx.createLinearGradient(0, 0, 0, ch);
                grad.addColorStop(0, 'rgba(255, 200, 180, 0.08)');
                grad.addColorStop(0.5, 'rgba(255, 180, 200, 0.05)');
                grad.addColorStop(1, 'rgba(255, 200, 180, 0.08)');
                hiresCtx.globalCompositeOperation = 'soft-light';
                hiresCtx.fillStyle = grad;
                hiresCtx.fillRect(0, 0, cw, ch);
                hiresCtx.globalCompositeOperation = 'source-over';
                
                return { dataUrl: hiresCanvas.toDataURL('image/jpeg', JPEG_QUALITY), width: cw, height: ch };
            } catch (e) { console.error(e); return null; }
        }
        
        // 다운로드 함수 (페이지 리셋 방지)
        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            // 즉시 제거하지 않고 약간의 딜레이 후 제거
            setTimeout(() => {
                document.body.removeChild(link);
            }, 100);
        }
        
        async function shareImage(dataUrl) {
            try {
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                const file = new File([blob], 'cherry-blossom-AR.jpg', { type: 'image/jpeg' });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ title: '나만의 벚꽃 터널 AR', text: '내가 직접 색칠한 벚꽃길에서 찍은 사진이야! 🌸', files: [file] });
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }
        
        function showCapturePreview(dataUrl, w, h) {
            capturePreviewImage.src = dataUrl;
            capturePreviewInfo.textContent = `고화질 ${w} x ${h} px`;
            capturePreviewModal.classList.add('show');
        }
        
        capturePreviewClose.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            capturePreviewModal.classList.remove('show');
        });
        
        async function startPhotoCapture(event) {
            // 페이지 리셋 방지
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            if (isCapturing) return;
            isCapturing = true;
            
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            for (let i = COUNTDOWN_SECONDS; i > 0; i--) {
                photoCountdown.textContent = i;
                photoCountdown.classList.remove('show');
                void photoCountdown.offsetWidth;
                photoCountdown.classList.add('show');
                await new Promise(r => setTimeout(r, 1000));
            }
            
            hideAllUI();
            photoCountdown.classList.remove('show');
            await new Promise(r => setTimeout(r, 150));
            shutterFlash.classList.add('flash');
            createShutterSound();
            
            const result = await captureHighResolution();
            
            setTimeout(() => shutterFlash.classList.remove('flash'), 400);
            setTimeout(() => { 
                showAllUI(); 
                isCapturing = false; 
            }, 500);
            
            if (result) {
                downloadImage(result.dataUrl, 'cherry-blossom-AR.jpg');
                showCapturePreview(result.dataUrl, result.width, result.height);
                await shareImage(result.dataUrl);
                showToast('📸 고화질 사진이 저장되었어요!', '🌸');
            } else { 
                showToast('사진 저장에 실패했어요', '😢'); 
            }
            
            return false;
        }
        
        // 꽃잎 폭발
        function createPetalBurst() {
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('div');
                petal.className = 'burst-petal';
                const angle = (i / 20) * 360 + (Math.random() - 0.5) * 40;
                const dist = 100 + Math.random() * 200;
                const tx = Math.cos(angle * Math.PI / 180) * dist;
                const ty = Math.sin(angle * Math.PI / 180) * dist;
                const rot = (Math.random() - 0.5) * 720;
                const size = 25 + Math.random() * 20;
                petal.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;--tx:${tx}px;--ty:${ty}px;--rot:${rot}deg;animation:petalBurst 2s cubic-bezier(0.25,0.46,0.45,0.94) forwards;animation-delay:${i*0.03}s;`;
                screenPetals.appendChild(petal);
                setTimeout(() => petal.remove(), 2500);
            }
        }
        
        // 마커 영역 추출
        function extractMarkerRegion() {
            if (!videoElement) return null;
            const vw = videoElement.videoWidth, vh = videoElement.videoHeight;
            if (vw === 0 || vh === 0) return null;
            const size = Math.min(vw, vh) * 0.55;
            let cw = size * 0.9, ch = (size / 1.5) * 0.9;
            return { x: Math.max(0, (vw - cw) / 2), y: Math.max(0, (vh - ch) / 2), width: cw, height: ch };
        }
        
        // 텍스처 스캔 및 색상 오버레이 적용
        function scanTexture(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            if (!videoElement || !isTargetFound) { showToast('도안을 카메라에 비춰주세요', '📷'); return false; }
            try {
                const region = extractMarkerRegion();
                if (!region) { showToast('도안 영역을 찾을 수 없습니다', '❌'); return false; }
                const cw = paintCanvas.width, ch = paintCanvas.height;
                paintCtx.clearRect(0, 0, cw, ch);
                paintCtx.imageSmoothingEnabled = true;
                paintCtx.imageSmoothingQuality = 'high';
                paintCtx.drawImage(videoElement, region.x, region.y, region.width, region.height, 0, 0, cw, ch);
                
                staticTexture = new THREE.CanvasTexture(paintCanvas);
                staticTexture.flipY = false;
                staticTexture.wrapS = THREE.ClampToEdgeWrapping;
                staticTexture.wrapT = THREE.ClampToEdgeWrapping;
                staticTexture.minFilter = THREE.LinearFilter;
                staticTexture.magFilter = THREE.LinearFilter;
                staticTexture.generateMipmaps = false;
                staticTexture.needsUpdate = true;
                
                if (colorOverlayPlane) {
                    const mesh = colorOverlayPlane.getObject3D('mesh');
                    if (mesh && mesh.material) {
                        mesh.material.map = staticTexture;
                        mesh.material.opacity = 0.85;
                        mesh.material.transparent = true;
                        mesh.material.needsUpdate = true;
                    }
                    colorOverlayPlane.setAttribute('visible', 'true');
                }
                
                texturePreview.src = paintCanvas.toDataURL('image/jpeg', 0.9);
                texturePreview.classList.add('show');
                isTextureScanned = true;
                scanButton.textContent = '✅ 스캔 완료!';
                scanButton.classList.add('scanned');
                photoCaptureButton.classList.add('show');
                showToast('🌸 도안이 성공적으로 스캔되었습니다!', '✨');
                createPetalBurst();
                return true;
            } catch (e) { console.error(e); showToast('스캔 중 오류가 발생했습니다', '❌'); return false; }
        }
        
        // 버튼 이벤트 (페이지 리셋 방지)
        scanButton.addEventListener('click', (e) => { 
            e.preventDefault();
            e.stopPropagation();
            if (isTextureScanned) { 
                showToast('이미 스캔이 완료되었습니다', '✅'); 
                return false; 
            } 
            scanTexture(e);
            return false;
        });
        
        photoCaptureButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startPhotoCapture(e);
            return false;
        });
        
        // 뒤로가기 버튼
        backButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // AR 정지
            if (sceneEl && sceneEl.systems && sceneEl.systems['mindar-image-system']) {
                try {
                    sceneEl.systems['mindar-image-system'].stop();
                } catch (err) {}
            }
            
            // UI 초기화
            sceneEl.style.display = 'none';
            buttonContainer.classList.remove('show');
            guideUI.classList.remove('show');
            warmOverlay.classList.remove('show');
            backButton.classList.remove('show');
            stopForegroundPetals();
            
            // 카메라 꽃잎 숨기기
            if (cameraPetals) cameraPetals.setAttribute('visible', 'false');
            
            // 시작 메뉴 다시 표시
            startMenu.classList.remove('hidden');
            currentMode = null;
            arStarted = false;
        });
        
        // 모드 시작 함수
        async function startMode(mode) {
            currentMode = mode;
            startMenu.classList.add('hidden');
            showLoadingScreen();
            
            // 씬 표시
            sceneEl.style.display = 'block';
            
            // AR 시작
            if (!arStarted) {
                sceneEl.systems['mindar-image-system'].start();
                arStarted = true;
            }
            
            // 공통 UI 표시
            backButton.classList.add('show');
            warmOverlay.classList.add('show');
            
            if (mode === 'blossom') {
                // 벚꽃 모드: 바로 카메라 + 꽃잎 + 촬영 버튼
                setTimeout(() => {
                    hideLoadingScreen();
                    forceVideoExpose();
                    fixBlackScreen();
                    
                    // 카메라 앞 꽃잎 표시
                    if (cameraPetals) cameraPetals.setAttribute('visible', 'true');
                    
                    // 화면 전체 꽃잎 시작
                    startForegroundPetals();
                    
                    // 촬영 버튼만 표시
                    buttonContainer.classList.add('show');
                    photoCaptureButton.classList.add('show');
                    scanButton.classList.remove('show');
                    
                    showToast('🌸 벚꽃과 함께 사진을 찍어보세요!', '📸');
                }, 1000);
                
            } else if (mode === 'kit') {
                // 키트 모드: 가이드 표시 후 마커 인식 대기
                setTimeout(() => {
                    hideLoadingScreen();
                    forceVideoExpose();
                    fixBlackScreen();
                    
                    // 가이드 표시
                    showGuide();
                    
                    // 버튼 컨테이너 표시 (스캔 버튼은 마커 인식 후)
                    buttonContainer.classList.add('show');
                    scanButton.classList.remove('show');
                    photoCaptureButton.classList.remove('show');
                    
                    showToast('📷 색칠한 도안을 카메라에 비춰주세요', '🎨');
                }, 1000);
            }
        }
        
        // 시작 메뉴 버튼 이벤트
        btnModeBlossom.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startMode('blossom');
        });
        
        btnModeKit.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startMode('kit');
        });
        
        // A-Frame 이벤트
        sceneEl.addEventListener('loaded', () => {
            if (sceneEl.renderer) {
                sceneEl.renderer.setClearColor(0x000000, 0);
            }
        });
        
        sceneEl.addEventListener('arReady', () => {
            hideLoadingScreen();
            forceVideoExpose();
            fixBlackScreen();
            setTimeout(fixBlackScreen, 500);
            setTimeout(fixBlackScreen, 1000);
        });
        
        sceneEl.addEventListener('arError', (e) => {
            console.error('AR Error:', e);
            showError('AR 초기화 실패', '카메라 접근 권한을 확인해주세요.\n또는 HTTPS 환경에서 실행해주세요.');
        });
        
        // 마커 인식 (키트 모드에서만 사용)
        arTarget.addEventListener('targetFound', () => {
            isTargetFound = true; 
            isTargetVisible = true;
            
            if (lostTimeout) { 
                clearTimeout(lostTimeout); 
                lostTimeout = null; 
            }
            
            if (currentMode === 'kit') {
                hideGuide(); 
                showStatus('🌸 도안 인식 완료!');
                if (!isTextureScanned) scanButton.classList.add('show');
                if (petalsContainer) petalsContainer.setAttribute('visible', 'true');
                if (reliefPlane) reliefPlane.setAttribute('visible', 'true');
                if (!hasExploded && isTextureScanned) { 
                    createPetalBurst(); 
                    hasExploded = true; 
                }
            }
        });
        
        arTarget.addEventListener('targetLost', () => {
            isTargetFound = false;
            if (lostTimeout) clearTimeout(lostTimeout);
            lostTimeout = setTimeout(() => {
                if (!isTargetFound && currentMode === 'kit') { 
                    isTargetVisible = false; 
                    showGuide(); 
                    showStatus('📷 도안을 다시 비춰주세요');
                    if (petalsContainer) petalsContainer.setAttribute('visible', 'false'); 
                }
            }, TRACKING_PERSISTENCE_MS);
        });
        
        // 초기화
        window.onload = function() {
            // 씬 숨김 상태 유지 (시작 메뉴 먼저)
            sceneEl.style.display = 'none';
        };
        
        console.log('🌸 벚꽃 터널 AR 포토존 준비 완료 (2D 이미지 기반, 듀얼 모드)');
    </script>
</body>
</html>
