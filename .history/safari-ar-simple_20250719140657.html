<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari AR 체험</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: block;
        }
        
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #camera-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
        
        .info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .mode-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 255, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .loading-text {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .camera-permission {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 200;
            display: none;
        }
        
        .permission-btn {
            background: #00C79F;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background 0.3s ease;
        }
        
        .permission-btn:hover {
            background: #00a085;
        }
        
        .ar-instructions {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 100;
            max-width: 300px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .video-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 80%;
            max-height: 60%;
        }
    </style>
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>Safari AR 체험 준비 중...</h2>
        <div class="loading-text" id="loading-text">카메라 초기화 중...</div>
    </div>
    
    <!-- 카메라 권한 요청 -->
    <div id="camera-permission" class="camera-permission">
        <h3>📱 카메라 접근 권한 필요</h3>
        <p>AR 체험을 위해 카메라 접근이 필요합니다.<br>실제 환경에 비디오를 오버레이할 수 있습니다.</p>
        <button class="permission-btn" onclick="requestCameraPermission()">카메라 허용</button>
        <button class="permission-btn" onclick="skipCamera()" style="background: #666;">건너뛰기</button>
    </div>
    
    <!-- 브라우저 정보 -->
    <div class="info" id="browser-info">🍎 Safari AR</div>
    
    <!-- 모드 표시 -->
    <div class="mode-indicator">🎬 AR 모드 (카메라 + 3D)</div>
    
    <!-- 카메라 배경 -->
    <video id="camera-background" autoplay muted playsinline></video>
    
    <!-- 3D 컨테이너 -->
    <div id="container">
        <div id="three-container"></div>
    </div>
    
    <!-- AR 사용법 안내 -->
    <div class="ar-instructions">
        📱 화면을 터치하고 드래그해서<br>비디오 위치를 조절해보세요!
    </div>
    
    <!-- 컨트롤 -->
    <div class="controls">
        <button class="control-btn" onclick="toggleVideo()">⏯️ 재생/정지</button>
        <button class="control-btn" onclick="toggleCamera()">📷 카메라</button>
        <button class="control-btn" onclick="resetPosition()">🎯 위치 리셋</button>
        <button class="control-btn" onclick="toggleFullscreen()">🔍 전체화면</button>
        <a href="index.html" class="control-btn">🏠 홈으로</a>
    </div>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // 전역 변수
        let scene, camera, renderer, video, videoTexture, videoMesh, controls;
        let cameraStream = null;
        let cameraVideo = null;
        let isCameraActive = false;
        let initializationComplete = false;
        
        // 로딩 상태 업데이트
        function updateLoadingText(text) {
            const loadingText = document.getElementById('loading-text');
            if (loadingText) {
                loadingText.textContent = text;
            }
            console.log('Loading:', text);
        }
        
        // 초기화
        function initialize() {
            updateLoadingText('브라우저 정보 수집 중...');
            
            setTimeout(() => {
                updateBrowserInfo();
                updateLoadingText('카메라 권한 확인 중...');
                
                setTimeout(() => {
                    checkCameraPermission();
                }, 500);
            }, 1000);
        }
        
        function updateBrowserInfo() {
            const ua = navigator.userAgent;
            const isMobile = /iPhone|iPad|iPod|Android/.test(ua);
            const browserInfo = document.getElementById('browser-info');
            
            if (isMobile) {
                browserInfo.textContent = '📱 Safari AR (모바일)';
            } else {
                browserInfo.textContent = '🖥️ Safari AR (데스크톱)';
            }
        }
        
        function checkCameraPermission() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.log('카메라 API 지원되지 않음');
                updateLoadingText('카메라 미지원 - 3D 모드로 진행');
                setTimeout(initializeWithoutCamera, 1000);
                return;
            }
            
            // 카메라 권한 요청 UI 표시
            document.getElementById('camera-permission').style.display = 'block';
            updateLoadingText('카메라 권한 대기 중...');
        }
        
        async function requestCameraPermission() {
            document.getElementById('camera-permission').style.display = 'none';
            updateLoadingText('카메라 접근 중...');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment', // 후면 카메라 선호
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                cameraStream = stream;
                cameraVideo = document.getElementById('camera-background');
                cameraVideo.srcObject = stream;
                isCameraActive = true;
                
                updateLoadingText('카메라 연결 성공!');
                setTimeout(() => {
                    initializeThreeJS();
                }, 500);
                
            } catch (error) {
                console.error('카메라 접근 실패:', error);
                updateLoadingText('카메라 접근 실패 - 3D 모드로 진행');
                setTimeout(initializeWithoutCamera, 1000);
            }
        }
        
        function skipCamera() {
            document.getElementById('camera-permission').style.display = 'none';
            updateLoadingText('3D 모드로 진행...');
            setTimeout(initializeWithoutCamera, 500);
        }
        
        function initializeWithoutCamera() {
            document.getElementById('camera-background').style.display = 'none';
            initializeThreeJS();
        }
        
        function initializeThreeJS() {
            try {
                updateLoadingText('3D 씬 생성 중...');
                
                // 씬 생성
                scene = new THREE.Scene();
                
                // 카메라가 없으면 어두운 배경
                if (!isCameraActive) {
                    scene.background = new THREE.Color(0x111111);
                }
                
                // 카메라 생성
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 3);
                
                // 렌더러 생성
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true,
                    premultipliedAlpha: false
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.setClearColor(0x000000, isCameraActive ? 0 : 1);
                
                const container = document.getElementById('three-container');
                container.appendChild(renderer.domElement);
                
                updateLoadingText('조명 설정 중...');
                
                // 조명 추가
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
                directionalLight.position.set(5, 5, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                updateLoadingText('비디오 준비 중...');
                
                // 비디오 엘리먼트 생성 (숨김)
                video = document.createElement('video');
                video.src = 'assets/lee.mp4';
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.controls = false;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                // 비디오 텍스처 생성
                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                
                // 비디오 스크린 메시 (AR 오버레이)
                const screenGeometry = new THREE.PlaneGeometry(2, 1.125); // 16:9 비율
                const screenMaterial = new THREE.MeshBasicMaterial({ 
                    map: videoTexture,
                    transparent: true,
                    opacity: 0.95,
                    side: THREE.DoubleSide
                });
                
                videoMesh = new THREE.Mesh(screenGeometry, screenMaterial);
                videoMesh.position.set(0, 0, 0);
                scene.add(videoMesh);
                
                // 비디오 프레임 추가
                const frameGeometry = new THREE.PlaneGeometry(2.1, 1.225);
                const frameMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x333333,
                    transparent: true,
                    opacity: 0.8
                });
                const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
                frameMesh.position.set(0, 0, -0.01);
                scene.add(frameMesh);
                
                updateLoadingText('컨트롤 설정 중...');
                
                // 컨트롤 추가
                if (THREE.OrbitControls) {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.enableZoom = true;
                    controls.enablePan = true;
                    controls.maxDistance = 10;
                    controls.minDistance = 1;
                }
                
                // 비디오 로드 이벤트
                video.addEventListener('loadeddata', () => {
                    console.log('비디오 로드 완료');
                    video.play().catch(error => {
                        console.log('자동 재생 실패:', error);
                    });
                });
                
                // 렌더 루프 시작
                animate();
                
                // 리사이즈 이벤트
                window.addEventListener('resize', onWindowResize);
                
                updateLoadingText('AR 체험 준비 완료!');
                
                setTimeout(finishLoading, 500);
                
            } catch (error) {
                console.error('Three.js 초기화 실패:', error);
                updateLoadingText('초기화 실패');
                setTimeout(finishLoading, 1000);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            // 비디오 메시 약간 회전 (AR 효과)
            if (videoMesh) {
                videoMesh.rotation.y += 0.002;
                videoMesh.rotation.x = Math.sin(Date.now() * 0.001) * 0.05;
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        function finishLoading() {
            updateLoadingText('완료!');
            
            setTimeout(() => {
                const loading = document.getElementById('loading');
                loading.style.opacity = '0';
                
                setTimeout(() => {
                    loading.style.display = 'none';
                    initializationComplete = true;
                    console.log('Safari AR 초기화 완료');
                }, 500);
            }, 500);
        }
        
        // 컨트롤 함수들
        function toggleVideo() {
            if (video) {
                if (video.paused) {
                    video.play().catch(error => {
                        console.log('재생 실패:', error);
                        alert('비디오 재생을 위해 화면을 터치해주세요.');
                    });
                } else {
                    video.pause();
                }
            }
        }
        
        function toggleCamera() {
            if (isCameraActive && cameraVideo) {
                if (cameraVideo.style.display === 'none') {
                    cameraVideo.style.display = 'block';
                    renderer.setClearColor(0x000000, 0);
                } else {
                    cameraVideo.style.display = 'none';
                    renderer.setClearColor(0x111111, 1);
                }
            } else {
                alert('카메라가 활성화되지 않았습니다.\n페이지를 새로고침하고 카메라 권한을 허용해주세요.');
            }
        }
        
        function resetPosition() {
            if (camera && controls) {
                camera.position.set(0, 0, 3);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        }
        
        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen().catch(error => {
                    console.log('전체화면 실패:', error);
                });
            }
        }
        
        // 터치 이벤트로 상호작용 증진
        let touchStartTime = 0;
        document.addEventListener('touchstart', (event) => {
            touchStartTime = Date.now();
            
            // 비디오 재생 시도 (사용자 상호작용)
            if (video && video.paused) {
                video.play().catch(console.log);
            }
        });
        
        document.addEventListener('touchend', (event) => {
            const touchDuration = Date.now() - touchStartTime;
            
            // 빠른 탭: 비디오 재생/정지
            if (touchDuration < 200) {
                toggleVideo();
            }
        });
        
        // 에러 처리
        window.addEventListener('error', function(error) {
            console.error('Global error:', error);
            const loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                updateLoadingText('로딩 실패 - 기본 모드로 전환');
                setTimeout(finishLoading, 1000);
            }
        });
        
        // 페이지 언로드 시 카메라 정리
        window.addEventListener('beforeunload', () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
        });
        
        // 페이지 로드 완료 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
    </script>
</body>
</html>
