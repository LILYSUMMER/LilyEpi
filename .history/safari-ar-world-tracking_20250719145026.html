<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 월드 트래킹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #camera-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        .camera-permission {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 2000;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .camera-permission.show {
            display: block !important;
            animation: fadeInScale 0.3s ease-out;
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .permission-btn {
            background: #00C79F;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .permission-btn:hover {
            background: #00a085;
            transform: translateY(-2px);
        }
        
        .permission-btn.secondary {
            background: #666;
        }
        
        .permission-btn.secondary:hover {
            background: #777;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 20px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px) scale(1.1);
        }
        
        .anchor-point {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255, 0, 0, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            pointer-events: none;
            animation: anchorPulse 1.5s infinite;
        }
        
        @keyframes anchorPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        }
        
        .world-tracking-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
        }
        
        .world-tracking-info.show {
            opacity: 1;
        }
        
        .loading-text {
            margin-top: 15px;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .debug-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 200;
            max-width: 250px;
            display: none;
        }
        
        .debug-overlay.show {
            display: block;
        }
        
        .touch-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 120;
            pointer-events: none;
            animation: touchRipple 0.6s ease-out;
        }
        
        @keyframes touchRipple {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>🌍 AR 월드 트래킹</h2>
        <div class="loading-text" id="loading-text">월드 트래킹 초기화 중...</div>
    </div>
    
    <!-- 카메라 권한 요청 -->
    <div id="camera-permission" class="camera-permission">
        <h3>🌍 AR 월드 트래킹</h3>
        <p>실제 공간에 고정되는 AR 체험을 위해<br>카메라와 센서 접근이 필요합니다.</p>
        <div style="margin: 20px 0;">
            <button class="permission-btn" onclick="requestPermissions()">
                🚀 시작하기
            </button>
            <br>
            <button class="permission-btn secondary" onclick="skipCamera()">
                건너뛰기
            </button>
        </div>
    </div>
    
    <!-- 월드 트래킹 정보 -->
    <div id="world-tracking-info" class="world-tracking-info">
        📍 화면을 터치해서 AR 앵커를 생성하세요<br>
        <small>터치한 위치에 비디오가 고정됩니다</small>
    </div>
    
    <!-- 디버그 오버레이 -->
    <div id="debug-overlay" class="debug-overlay">
        <div id="debug-content"></div>
    </div>
    
    <!-- 카메라 배경 -->
    <video id="camera-background" autoplay muted playsinline></video>
    
    <!-- 3D 컨테이너 -->
    <div id="container">
        <div id="three-container"></div>
    </div>
    
    <!-- 컨트롤 -->
    <div class="controls">
        <button class="control-btn" onclick="toggleVideo()" title="재생/정지">⏯️</button>
        <button class="control-btn" onclick="resetAnchors()" title="앵커 리셋">🎯</button>
        <button class="control-btn" onclick="toggleDebug()" title="디버그">🐛</button>
        <a href="index.html" class="control-btn" title="홈으로">🏠</a>
    </div>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 전역 변수
        let scene, camera, renderer, video, videoTexture, videoMesh;
        let cameraStream = null;
        let cameraVideo = null;
        let isCameraActive = false;
        let debugMode = false;
        let touchEnabled = false;
        
        let worldTracking = {
            anchors: [],
            deviceOrientation: { alpha: 0, beta: 0, gamma: 0 },
            isTracking: false,
            trackingQuality: 'none'
        };
        
        // 디버그 로그 함수
        function debugLog(message, type = 'info') {
            console.log(`[AR] ${message}`);
            
            if (debugMode) {
                const debugContent = document.getElementById('debug-content');
                if (debugContent) {
                    const timestamp = new Date().toLocaleTimeString();
                    debugContent.innerHTML = `
                        <div>월드 트래킹: ${worldTracking.isTracking ? '활성' : '비활성'}</div>
                        <div>앵커 수: ${worldTracking.anchors.length}</div>
                        <div>터치: ${touchEnabled ? '활성' : '비활성'}</div>
                        <div>센서: α${worldTracking.deviceOrientation.alpha.toFixed(1)}° β${worldTracking.deviceOrientation.beta.toFixed(1)}° γ${worldTracking.deviceOrientation.gamma.toFixed(1)}°</div>
                        <hr style="margin: 5px 0;">
                        <div style="font-size: 10px;">[${timestamp}] ${message}</div>
                    `;
                }
            }
        }
        
        // 월드 트래킹 초기화
        function initializeWorldTracking() {
            debugLog('월드 트래킹 시스템 초기화');
            
            // 디바이스 방향 센서
            if (window.DeviceOrientationEvent) {
                // iOS 13+ 권한 확인
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    debugLog('iOS 디바이스 방향 권한 필요');
                } else {
                    window.addEventListener('deviceorientation', handleDeviceOrientation);
                    debugLog('디바이스 방향 센서 활성화');
                }
            } else {
                debugLog('디바이스 방향 센서 미지원');
            }
            
            // 디바이스 모션 센서
            if (window.DeviceMotionEvent) {
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    debugLog('iOS 디바이스 모션 권한 필요');
                } else {
                    window.addEventListener('devicemotion', handleDeviceMotion);
                    debugLog('디바이스 모션 센서 활성화');
                }
            } else {
                debugLog('디바이스 모션 센서 미지원');
            }
            
            // 터치 이벤트 활성화
            enableTouchEvents();
            
            worldTracking.isTracking = true;
            worldTracking.trackingQuality = 'good';
            
            showWorldTrackingInfo();
            debugLog('월드 트래킹 활성화 완료');
        }
        
        function enableTouchEvents() {
            touchEnabled = true;
            
            // 터치 이벤트
            document.addEventListener('touchstart', handleTouch, { passive: false });
            document.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // 마우스 이벤트 (PC 테스트용)
            document.addEventListener('mousedown', handleTouch, { passive: false });
            
            debugLog('터치 이벤트 활성화');
        }
        
        function handleDeviceOrientation(event) {
            const newOrientation = {
                alpha: event.alpha || 0,  // Z축 회전 (나침반)
                beta: event.beta || 0,    // X축 회전 (앞뒤 기울기)
                gamma: event.gamma || 0   // Y축 회전 (좌우 기울기)
            };
            
            // 큰 변화가 있을 때만 업데이트
            const threshold = 1;
            if (Math.abs(newOrientation.alpha - worldTracking.deviceOrientation.alpha) > threshold ||
                Math.abs(newOrientation.beta - worldTracking.deviceOrientation.beta) > threshold ||
                Math.abs(newOrientation.gamma - worldTracking.deviceOrientation.gamma) > threshold) {
                
                worldTracking.deviceOrientation = newOrientation;
                
                if (camera && worldTracking.isTracking) {
                    updateCameraOrientation();
                }
            }
        }
        
        function handleDeviceMotion(event) {
            // 가속도 정보로 움직임 감지
            const acceleration = event.acceleration;
            if (acceleration && worldTracking.isTracking) {
                const totalAccel = Math.sqrt(
                    acceleration.x * acceleration.x +
                    acceleration.y * acceleration.y +
                    acceleration.z * acceleration.z
                );
                
                // 큰 움직임 감지 시 트래킹 품질 조정
                if (totalAccel > 2) {
                    worldTracking.trackingQuality = 'limited';
                } else {
                    worldTracking.trackingQuality = 'good';
                }
            }
        }
        
        function updateCameraOrientation() {
            if (!camera || !worldTracking.isTracking) return;
            
            const { alpha, beta, gamma } = worldTracking.deviceOrientation;
            
            // 더 부드러운 카메라 업데이트
            const smoothing = 0.05;
            const alphaRad = (alpha * Math.PI) / 180;
            const betaRad = (beta * Math.PI) / 180;
            const gammaRad = (gamma * Math.PI) / 180;
            
            // 카메라 회전을 부드럽게 적용
            camera.rotation.x += (betaRad * 0.5 - camera.rotation.x) * smoothing;
            camera.rotation.y += (alphaRad * 0.5 - camera.rotation.y) * smoothing;
            camera.rotation.z += (gammaRad * 0.3 - camera.rotation.z) * smoothing;
        }
        
        function handleTouch(event) {
            if (!worldTracking.isTracking || !touchEnabled) return;
            
            event.preventDefault();
            event.stopPropagation();
            
            // 터치 위치 가져오기
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            debugLog(`터치 감지: (${clientX}, ${clientY})`);
            
            // 터치 시각 효과
            showTouchIndicator(clientX, clientY);
            
            // 앵커 포인트 생성
            createAnchor(clientX, clientY);
        }
        
        function handleTouchEnd(event) {
            // 터치 종료 처리
        }
        
        function showTouchIndicator(x, y) {
            const indicator = document.createElement('div');
            indicator.className = 'touch-indicator';
            indicator.style.left = x + 'px';
            indicator.style.top = y + 'px';
            document.body.appendChild(indicator);
            
            setTimeout(() => {
                if (indicator.parentNode) {
                    document.body.removeChild(indicator);
                }
            }, 600);
        }
        
        function createAnchor(x, y) {
            debugLog(`앵커 생성 시도: (${x}, ${y})`);
            
            // 기존 앵커 제거 (하나만 유지)
            worldTracking.anchors = [];
            document.querySelectorAll('.anchor-point').forEach(el => el.remove());
            
            // 화면 좌표를 정규화된 좌표로 변환
            const normalizedX = (x / window.innerWidth) * 2 - 1;
            const normalizedY = -(y / window.innerHeight) * 2 + 1;
            
            debugLog(`정규화된 좌표: (${normalizedX.toFixed(2)}, ${normalizedY.toFixed(2)})`);
            
            // 3D 공간에서의 위치 계산 (간단한 방법)
            const distance = 2; // 카메라에서 2미터 앞
            const worldX = normalizedX * distance;
            const worldY = normalizedY * distance;
            const worldZ = -distance;
            
            const worldPosition = new THREE.Vector3(worldX, worldY, worldZ);
            
            // 앵커 포인트 생성
            const anchor = {
                id: Date.now(),
                position: worldPosition,
                screenPosition: { x, y },
                timestamp: Date.now()
            };
            
            worldTracking.anchors.push(anchor);
            
            debugLog(`앵커 생성됨: 3D(${worldX.toFixed(2)}, ${worldY.toFixed(2)}, ${worldZ.toFixed(2)})`);
            
            // 비디오 메시를 앵커 위치로 이동
            if (videoMesh) {
                videoMesh.position.copy(worldPosition);
                debugLog('비디오 메시 위치 업데이트');
            }
            
            // 시각적 앵커 표시
            showAnchorPoint(x, y);
        }
        
        function showAnchorPoint(x, y) {
            const anchorElement = document.createElement('div');
            anchorElement.className = 'anchor-point';
            anchorElement.style.left = x + 'px';
            anchorElement.style.top = y + 'px';
            document.body.appendChild(anchorElement);
            
            debugLog(`앵커 포인트 UI 표시: (${x}, ${y})`);
            
            // 5초 후 제거
            setTimeout(() => {
                if (anchorElement.parentNode) {
                    document.body.removeChild(anchorElement);
                }
            }, 5000);
        }
        
        function showWorldTrackingInfo() {
            const info = document.getElementById('world-tracking-info');
            info.classList.add('show');
            
            setTimeout(() => {
                info.classList.remove('show');
            }, 8000);
        }
        
        function resetAnchors() {
            worldTracking.anchors = [];
            
            // 비디오 위치 초기화
            if (videoMesh) {
                videoMesh.position.set(0, 0, -2);
            }
            
            // 기존 앵커 포인트 제거
            document.querySelectorAll('.anchor-point').forEach(el => el.remove());
            
            debugLog('모든 앵커 리셋');
        }
        
        function toggleDebug() {
            debugMode = !debugMode;
            const debugOverlay = document.getElementById('debug-overlay');
            
            if (debugMode) {
                debugOverlay.classList.add('show');
                debugLog('디버그 모드 활성화');
            } else {
                debugOverlay.classList.remove('show');
            }
        }
        
        // 로딩 상태 업데이트
        function updateLoadingText(text) {
            const loadingText = document.getElementById('loading-text');
            if (loadingText) {
                loadingText.textContent = text;
            }
            debugLog(`로딩: ${text}`);
        }
        
        // 초기화
        function initialize() {
            debugLog('AR 월드 트래킹 초기화 시작');
            updateLoadingText('센서 확인 중...');
            
            setTimeout(() => {
                updateLoadingText('권한 요청 준비...');
                
                setTimeout(() => {
                    showCameraPermission();
                    updateLoadingText('권한 대기 중...');
                }, 500);
            }, 1500);
        }
        
        function showCameraPermission() {
            const permissionDiv = document.getElementById('camera-permission');
            permissionDiv.classList.add('show');
        }
        
        function hideCameraPermission() {
            const permissionDiv = document.getElementById('camera-permission');
            permissionDiv.classList.remove('show');
        }
        
        async function requestPermissions() {
            hideCameraPermission();
            updateLoadingText('센서 권한 요청 중...');
            
            // iOS에서 디바이스 방향 권한 요청
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleDeviceOrientation);
                        debugLog('디바이스 방향 권한 허용됨');
                    } else {
                        debugLog('디바이스 방향 권한 거부됨');
                    }
                } catch (error) {
                    debugLog(`디바이스 방향 권한 요청 실패: ${error.message}`);
                }
            }
            
            // iOS에서 디바이스 모션 권한 요청
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('devicemotion', handleDeviceMotion);
                        debugLog('디바이스 모션 권한 허용됨');
                    } else {
                        debugLog('디바이스 모션 권한 거부됨');
                    }
                } catch (error) {
                    debugLog(`디바이스 모션 권한 요청 실패: ${error.message}`);
                }
            }
            
            updateLoadingText('카메라 접근 중...');
            
            // 카메라 권한 요청
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                cameraStream = stream;
                cameraVideo = document.getElementById('camera-background');
                cameraVideo.srcObject = stream;
                isCameraActive = true;
                
                debugLog('카메라 활성화 성공');
                updateLoadingText('월드 트래킹 설정 중...');
                
                setTimeout(() => {
                    initializeThreeJS();
                    initializeWorldTracking();
                }, 1000);
                
            } catch (error) {
                debugLog(`카메라 접근 실패: ${error.message}`);
                updateLoadingText('카메라 없이 진행...');
                setTimeout(() => {
                    initializeWithoutCamera();
                    initializeWorldTracking();
                }, 1000);
            }
        }
        
        function skipCamera() {
            hideCameraPermission();
            updateLoadingText('센서 모드로 진행...');
            setTimeout(() => {
                initializeWithoutCamera();
                initializeWorldTracking();
            }, 1000);
        }
        
        function initializeWithoutCamera() {
            document.getElementById('camera-background').style.display = 'none';
            initializeThreeJS();
        }
        
        function initializeThreeJS() {
            debugLog('Three.js 초기화 시작');
            
            try {
                updateLoadingText('3D 환경 생성 중...');
                
                // 씬 생성
                scene = new THREE.Scene();
                
                if (!isCameraActive) {
                    scene.background = new THREE.Color(0x222222);
                }
                
                // 카메라 생성
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 2); // 사람 눈높이
                
                // 렌더러 생성
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.setClearColor(0x000000, isCameraActive ? 0 : 1);
                
                document.getElementById('three-container').appendChild(renderer.domElement);
                
                // 조명
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                // 비디오 엘리먼트
                video = document.createElement('video');
                video.src = 'assets/lee.mp4';
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                // 비디오 텍스처
                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                
                // 비디오 스크린 (AR 오브젝트)
                const screenGeometry = new THREE.PlaneGeometry(1.6, 0.9); // 16:9 비율
                const screenMaterial = new THREE.MeshLambertMaterial({ 
                    map: videoTexture,
                    transparent: true,
                    opacity: 0.95
                });
                
                videoMesh = new THREE.Mesh(screenGeometry, screenMaterial);
                videoMesh.position.set(0, 0, -2); // 2미터 앞에 배치
                videoMesh.castShadow = true;
                scene.add(videoMesh);
                
                // 참조용 바닥 (카메라 모드에서는 투명)
                const floorGeometry = new THREE.PlaneGeometry(10, 10);
                const floorMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0x404040,
                    transparent: true,
                    opacity: isCameraActive ? 0 : 0.2
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -1;
                floor.receiveShadow = true;
                scene.add(floor);
                
                // 비디오 로드 이벤트
                video.addEventListener('loadeddata', () => {
                    debugLog('비디오 로드 완료');
                    video.play().catch(console.log);
                });
                
                // 렌더 루프
                animate();
                
                // 리사이즈 이벤트
                window.addEventListener('resize', onWindowResize);
                
                debugLog('Three.js 초기화 완료');
                updateLoadingText('완료!');
                setTimeout(finishLoading, 1000);
                
            } catch (error) {
                debugLog(`Three.js 초기화 실패: ${error.message}`);
                updateLoadingText('초기화 실패');
                setTimeout(finishLoading, 2000);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // 월드 트래킹 업데이트
            if (worldTracking.isTracking) {
                updateWorldTracking();
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function updateWorldTracking() {
            // 앵커 포인트가 있으면 비디오를 고정
            if (worldTracking.anchors.length > 0 && videoMesh) {
                const anchor = worldTracking.anchors[0];
                
                // 센서 기반 위치 보정
                const orientationOffset = new THREE.Vector3(
                    Math.sin(worldTracking.deviceOrientation.gamma * Math.PI / 180) * 0.02,
                    Math.sin(worldTracking.deviceOrientation.beta * Math.PI / 180) * 0.02,
                    0
                );
                
                // 비디오 위치를 앵커에 고정
                videoMesh.position.copy(anchor.position);
                videoMesh.position.add(orientationOffset);
                
                // 자연스러운 미세 애니메이션
                videoMesh.rotation.y += 0.002;
            }
        }
        
        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        function finishLoading() {
            const loading = document.getElementById('loading');
            loading.style.opacity = '0';
            
            setTimeout(() => {
                loading.style.display = 'none';
                debugLog('AR 월드 트래킹 준비 완료');
            }, 500);
        }
        
        // 컨트롤 함수
        function toggleVideo() {
            if (video) {
                if (video.paused) {
                    video.play().catch(console.log);
                    debugLog('비디오 재생');
                } else {
                    video.pause();
                    debugLog('비디오 정지');
                }
            }
        }
        
        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
        });
        
        // 초기화 시작
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
    </script>
</body>
</html>
