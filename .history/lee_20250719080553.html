<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서귀포의 환상</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }
        
        #ui.hidden {
            display: none;
        }
        
        .ui-container {
            text-align: center;
            max-width: 90%;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #FF6B00, #FF8E53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #startButton {
            padding: 20px 40px;
            font-size: 18px;
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin: 20px;
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        #startButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 123, 255, 0.4);
        }
        
        #startButton:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        #status {
            margin: 20px 0;
            font-size: 16px;
            opacity: 0.9;
        }
        
        #debugInfo {
            margin: 10px 0;
            font-size: 12px;
            color: #aaa;
            opacity: 0.7;
        }
        
        .feature-list {
            text-align: left;
            margin: 20px 0;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .feature-list li {
            margin: 8px 0;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
            display: none;
        }
        
        .control-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 12px 16px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        #fallbackContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 999;
        }
        
        #fallbackVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- UI Overlay -->
    <div id="ui">
        <div class="ui-container">
            <h1>🎬 서귀포의 환상</h1>
            <p id="status">시스템 확인 중...</p>
            <p id="debugInfo">A-Frame 로딩 중...</p>
            
            <div class="feature-list">
                <h3>✨ 체험 기능</h3>
                <ul>
                    <li>🏝️ WebXR 지원 기기: 실제 공간에 AR 비디오 배치</li>
                    <li>📱 일반 기기: 몰입형 비디오 체험</li>
                    <li>🎥 16:9 고화질 비디오 재생</li>
                    <li>🔄 자동 루프 재생</li>
                </ul>
            </div>
            
            <button id="startButton" disabled>
                <span id="buttonText">체험 시작</span>
            </button>
            
            <p style="font-size: 12px; opacity: 0.6; margin-top: 20px;">
                최상의 체험을 위해 이어폰 사용을 권장합니다
            </p>
        </div>
    </div>
    
    <!-- AR Controls -->
    <div id="controls">
        <button class="control-btn" onclick="exitAR()">🏠 돌아가기</button>
        <button class="control-btn" onclick="toggleVideo()">⏯️ 재생/정지</button>
        <button class="control-btn" onclick="resetPosition()">🔄 위치 초기화</button>
    </div>
    
    <!-- Fallback Video Container -->
    <div id="fallbackContainer">
        <video id="fallbackVideo" controls autoplay loop muted playsinline>
            <source src="assets/lee.mp4" type="video/mp4">
            비디오를 지원하지 않는 브라우저입니다.
        </video>
        <div style="position: absolute; top: 20px; left: 20px;">
            <button class="control-btn" onclick="exitFallback()">🏠 돌아가기</button>
        </div>
    </div>
    
    <!-- A-Frame Scene -->
    <a-scene 
        id="arScene"
        embedded 
        style="height: 100vh; width: 100vw; display: none;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        webxr="requiredFeatures: local,hit-test,plane-detection;
               optionalFeatures: dom-overlay,unbounded;
               overlayElement: #ui"
        background="color: #000; transparent: true"
        renderer="alpha: true; antialias: true">
        
        <!-- Assets -->
        <a-assets>
            <video id="arVideo" 
                   src="assets/lee.mp4" 
                   preload="auto" 
                   autoplay 
                   loop 
                   muted 
                   playsinline 
                   crossorigin="anonymous">
            </video>
        </a-assets>
        
        <!-- AR Camera -->
        <a-camera 
            id="arCamera"
            position="0 1.6 0"
            wasd-controls="enabled: false"
            look-controls="enabled: true">
        </a-camera>
        
        <!-- Video Screen (initially hidden) -->
        <a-plane 
            id="videoScreen"
            material="src: #arVideo; transparent: true; alphaTest: 0.1"
            geometry="width: 1.778; height: 1"
            position="0 1 -2"
            rotation="0 0 0"
            visible="false"
            class="raycastable">
        </a-plane>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
        <a-light type="directional" position="1 4 1" color="#ffffff" intensity="0.8"></a-light>
        
    </a-scene>
    
    <!-- JavaScript Controller -->
    <script src="ar-controller.js" onerror="console.warn('ar-controller.js not found, using basic functionality')"></script>
    
    <script>
        // Main Application Controller
        class ARVideoApp {
            constructor() {
                this.isARMode = false;
                this.isSessionActive = false;
                this.videoPlaced = false;
                this.scene = null;
                this.camera = null;
                this.videoScreen = null;
                this.video = null;
                this.frameCount = 0;
                this.hasAdvancedController = false;
                
                this.init();
            }
            
            async init() {
                this.debugLog('A-Frame 애플리케이션 시작');
                
                // A-Frame이 로드될 때까지 대기
                if (typeof AFRAME === 'undefined') {
                    this.debugLog('A-Frame 로딩 대기 중...');
                    await this.waitForAFrame();
                }
                
                this.debugLog('A-Frame 로딩 완료');
                this.setupScene();
                this.checkXRSupport();
            }
            
            async waitForAFrame() {
                return new Promise(resolve => {
                    const checkAFrame = () => {
                        if (typeof AFRAME !== 'undefined') {
                            resolve();
                        } else {
                            setTimeout(checkAFrame, 100);
                        }
                    };
                    checkAFrame();
                });
            }
            
            setupScene() {
                this.scene = document.querySelector('#arScene');
                this.camera = document.querySelector('#arCamera');
                this.videoScreen = document.querySelector('#videoScreen');
                this.video = document.querySelector('#arVideo');
                
                // A-Frame 로딩 완료 대기
                this.scene.addEventListener('loaded', () => {
                    this.debugLog('A-Frame Scene 로딩 완료');
                    this.setupAdvancedFeatures();
                });
                
                // Scene 이벤트 리스너
                this.scene.addEventListener('enter-vr', () => {
                    this.debugLog('VR/AR 모드 진입');
                    this.onEnterAR();
                });
                
                this.scene.addEventListener('exit-vr', () => {
                    this.debugLog('VR/AR 모드 종료');
                    this.onExitAR();
                });
                
                // Hit test 이벤트 리스너 (평면 탐지)
                this.setupHitTest();
                
                // A-Frame AR 이벤트들
                this.setupAREvents();
                
                this.debugLog('Scene 설정 완료');
            }
            
            setupAdvancedFeatures() {
                // 고급 컨트롤러가 로드되었는지 확인
                if (typeof window.ARController !== 'undefined') {
                    this.hasAdvancedController = true;
                    this.debugLog('고급 AR 컨트롤러 감지됨');
                    
                    // 고급 컴포넌트들을 동적으로 추가
                    if (typeof AFRAME !== 'undefined' && AFRAME.components['ar-plane-detector']) {
                        this.scene.setAttribute('ar-plane-detector', '');
                        this.scene.setAttribute('performance-monitor', 'enabled: true');
                        this.videoScreen.setAttribute('gesture-controls', 'enabled: true');
                        this.debugLog('고급 컴포넌트들 활성화됨');
                    }
                } else {
                    this.debugLog('기본 기능만 사용함');
                }
            }
            
            setupAREvents() {
                // A-Frame 특화 이벤트들
                this.scene.addEventListener('renderstart', () => {
                    this.frameCount++;
                });
                
                // WebXR 세션 이벤트
                if (this.scene.renderer && this.scene.renderer.xr) {
                    this.scene.renderer.xr.addEventListener('sessionstart', () => {
                        this.debugLog('WebXR 세션 시작됨 (A-Frame)');
                    });
                    
                    this.scene.renderer.xr.addEventListener('sessionend', () => {
                        this.debugLog('WebXR 세션 종료됨 (A-Frame)');
                    });
                }
                
                // 커스텀 이벤트들
                this.scene.addEventListener('plane-detected', (event) => {
                    this.debugLog('평면 탐지됨 (고급)');
                    if (!this.videoPlaced) {
                        this.placeVideoFromEvent(event);
                    }
                });
                
                this.scene.addEventListener('video-placed', (event) => {
                    this.debugLog('비디오 배치 완료 (고급)');
                    this.onVideoPlaced(event);
                });
            }
            
            async checkXRSupport() {
                try {
                    if (navigator.xr) {
                        this.debugLog('WebXR API 감지됨');
                        
                        const supported = await Promise.race([
                            navigator.xr.isSessionSupported('immersive-ar'),
                            new Promise(resolve => setTimeout(() => resolve(false), 3000))
                        ]);
                        
                        if (supported) {
                            this.debugLog('WebXR AR 모드 지원됨');
                            this.isARMode = true;
                            this.updateStatus('🚀 AR 모드 사용 가능');
                        } else {
                            this.debugLog('WebXR AR 모드 지원되지 않음');
                            this.isARMode = false;
                            this.updateStatus('📱 비디오 모드로 재생됩니다');
                        }
                    } else {
                        this.debugLog('WebXR API 없음');
                        this.isARMode = false;
                        this.updateStatus('📱 비디오 모드로 재생됩니다');
                    }
                    
                    this.enableStartButton();
                } catch (error) {
                    this.debugLog('XR 지원 확인 오류: ' + error.message);
                    this.isARMode = false;
                    this.updateStatus('📱 비디오 모드로 재생됩니다');
                    this.enableStartButton();
                }
            }
            
            setupHitTest() {
                // 화면 터치/클릭으로 비디오 배치
                this.scene.addEventListener('click', (event) => {
                    if (this.isSessionActive && !this.videoPlaced) {
                        this.placeVideoAtHit(event);
                    }
                });
                
                // 자동 평면 탐지 (3초 후)
                setTimeout(() => {
                    if (this.isSessionActive && !this.videoPlaced) {
                        this.autoPlaceVideo();
                    }
                }, 3000);
            }
            
            placeVideoAtHit(event) {
                this.debugLog('비디오 배치 시도');
                
                // 기본 위치에 비디오 배치
                const position = { x: 0, y: 0, z: -2 };
                this.placeVideo(position);
            }
            
            autoPlaceVideo() {
                this.debugLog('자동 비디오 배치');
                
                // 사용자 앞 2미터 지점에 배치
                const cameraPos = this.camera.getAttribute('position');
                const cameraRot = this.camera.getAttribute('rotation');
                
                // 카메라 앞쪽 방향 계산
                const position = {
                    x: cameraPos.x,
                    y: cameraPos.y - 0.5, // 약간 아래쪽
                    z: cameraPos.z - 2    // 2미터 앞
                };
                
                this.placeVideo(position);
            }
            
            placeVideo(position) {
                if (this.videoPlaced) return;
                
                this.debugLog('비디오 배치: ' + JSON.stringify(position));
                
                // A-Frame 특화 배치 애니메이션
                this.animateVideoPlacement(position);
                
                this.videoPlaced = true;
                
                // 컨트롤 표시
                document.getElementById('controls').style.display = 'block';
            }
            
            animateVideoPlacement(position) {
                // 비디오 스크린 위치 설정
                this.videoScreen.setAttribute('position', position);
                this.videoScreen.setAttribute('visible', true);
                
                // 카메라를 향하도록 회전
                this.videoScreen.setAttribute('look-at', '[camera]');
                
                // A-Frame 애니메이션 추가
                this.videoScreen.setAttribute('scale', '0.1 0.1 0.1');
                this.videoScreen.setAttribute('animation', {
                    property: 'scale',
                    to: '1 1 1',
                    dur: 1000,
                    easing: 'easeOutElastic'
                });
                
                // 페이드 인 효과
                setTimeout(() => {
                    this.videoScreen.setAttribute('animation__opacity', {
                        property: 'material.opacity',
                        from: 0,
                        to: 1,
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }, 200);
                
                // 비디오 재생 시작
                this.video.play().then(() => {
                    this.debugLog('비디오 재생 시작됨');
                    this.updateStatus('🎬 비디오가 배치되었습니다');
                    
                    // 햅틱 피드백
                    if (navigator.vibrate) {
                        navigator.vibrate([50, 100, 50]);
                    }
                }).catch(error => {
                    this.debugLog('비디오 재생 실패: ' + error.message);
                });
            }
            
            placeVideoFromEvent(event) {
                if (this.videoPlaced) return;
                
                const detail = event.detail;
                if (detail && detail.pose) {
                    const pose = detail.pose;
                    const position = {
                        x: pose.transform.position.x,
                        y: pose.transform.position.y + 0.5,
                        z: pose.transform.position.z
                    };
                    this.placeVideo(position);
                } else {
                    // 기본 위치에 배치
                    this.autoPlaceVideo();
                }
            }
            
            onVideoPlaced(event) {
                this.debugLog('비디오 배치 이벤트 수신됨');
                this.updateStatus('🎬 AR 비디오 체험을 즐기세요!');
                
                // 추가 UI 업데이트
                setTimeout(() => {
                    this.updateStatus('');
                }, 3000);
            }
            
            onEnterAR() {
                this.isSessionActive = true;
                this.hideUI();
                this.updateStatus('📱 화면을 터치하여 비디오를 배치하세요');
            }
            
            onExitAR() {
                this.isSessionActive = false;
                this.videoPlaced = false;
                this.videoScreen.setAttribute('visible', false);
                this.showUI();
                document.getElementById('controls').style.display = 'none';
            }
            
            async startExperience() {
                this.debugLog('체험 시작: ' + (this.isARMode ? 'AR' : '비디오') + ' 모드');
                
                if (this.isARMode) {
                    await this.startARMode();
                } else {
                    this.startVideoMode();
                }
            }
            
            async startARMode() {
                try {
                    this.debugLog('AR 모드 시작');
                    this.updateStatus('AR 모드 시작 중...');
                    
                    // A-Frame Scene 표시
                    this.scene.style.display = 'block';
                    
                    // AR 세션 시작
                    await this.scene.enterVR();
                    
                } catch (error) {
                    this.debugLog('AR 모드 실패: ' + error.message);
                    this.updateStatus('AR 시작 실패 - 비디오 모드로 전환 중...');
                    
                    setTimeout(() => {
                        this.isARMode = false;
                        this.startVideoMode();
                    }, 1500);
                }
            }
            
            startVideoMode() {
                this.debugLog('비디오 모드 시작');
                this.updateStatus('비디오 모드 시작 중...');
                
                // Fallback 비디오 표시
                const container = document.getElementById('fallbackContainer');
                const video = document.getElementById('fallbackVideo');
                
                container.style.display = 'block';
                this.hideUI();
                
                // 비디오 재생 시도
                video.play().then(() => {
                    this.debugLog('Fallback 비디오 재생 성공');
                }).catch(error => {
                    this.debugLog('Fallback 비디오 재생 실패: ' + error.message);
                });
            }
            
            enableStartButton() {
                const button = document.getElementById('startButton');
                const buttonText = document.getElementById('buttonText');
                
                button.disabled = false;
                buttonText.textContent = this.isARMode ? '🚀 AR 체험 시작' : '🎬 비디오 재생';
                
                button.onclick = () => this.startExperience();
                
                this.debugLog('시작 버튼 활성화됨');
            }
            
            updateStatus(message) {
                document.getElementById('status').textContent = message;
            }
            
            debugLog(message) {
                console.log('[DEBUG]', message);
                const debugElement = document.getElementById('debugInfo');
                if (debugElement) {
                    debugElement.textContent = message;
                }
            }
            
            hideUI() {
                document.getElementById('ui').classList.add('hidden');
            }
            
            showUI() {
                document.getElementById('ui').classList.remove('hidden');
            }
        }
        
        // Global Functions for Controls
        window.exitAR = function() {
            app.scene.exitVR();
        };
        
        window.exitFallback = function() {
            const container = document.getElementById('fallbackContainer');
            const video = document.getElementById('fallbackVideo');
            
            video.pause();
            container.style.display = 'none';
            app.showUI();
            app.updateStatus(app.isARMode ? '🚀 AR 모드 사용 가능' : '📱 비디오 모드로 재생됩니다');
        };
        
        window.toggleVideo = function() {
            if (app.video) {
                if (app.video.paused) {
                    app.video.play();
                    app.debugLog('비디오 재생 재개');
                } else {
                    app.video.pause();
                    app.debugLog('비디오 일시정지');
                }
            }
        };
        
        window.resetPosition = function() {
            if (app.videoScreen && app.videoPlaced) {
                // A-Frame 애니메이션으로 부드럽게 제거
                app.videoScreen.setAttribute('animation__scaleout', {
                    property: 'scale',
                    to: '0.1 0.1 0.1',
                    dur: 400,
                    easing: 'easeInQuad'
                });
                
                setTimeout(() => {
                    app.videoPlaced = false;
                    app.videoScreen.setAttribute('visible', false);
                    app.videoScreen.removeAttribute('animation');
                    app.videoScreen.removeAttribute('animation__opacity');
                    app.videoScreen.removeAttribute('animation__scaleout');
                    app.videoScreen.setAttribute('scale', '1 1 1');
                    
                    // 고급 컨트롤러의 reset 호출 (있다면)
                    if (app.hasAdvancedController && app.scene.components['smart-video-placer']) {
                        app.scene.components['smart-video-placer'].reset();
                    }
                    
                    app.updateStatus('📱 화면을 터치하여 비디오를 다시 배치하세요');
                    app.debugLog('비디오 위치 초기화 완료');
                }, 400);
            }
        };
        
        // 애플리케이션 시작
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new ARVideoApp();
        });
    </script>
</body>
</html>
