<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR SLAM 월드 트래킹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #camera-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        #slam-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
        }
        
        .camera-permission {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 2000;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .camera-permission.show {
            display: block !important;
            animation: fadeInScale 0.3s ease-out;
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .permission-btn {
            background: #00C79F;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .permission-btn:hover {
            background: #00a085;
            transform: translateY(-2px);
        }
        
        .permission-btn.secondary {
            background: #666;
        }
        
        .permission-btn.secondary:hover {
            background: #777;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 20px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px) scale(1.1);
        }
        
        .control-btn.active {
            background: rgba(0, 255, 0, 0.7);
        }
        
        .anchor-point {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255, 0, 0, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            pointer-events: none;
            animation: anchorPulse 1.5s infinite;
        }
        
        @keyframes anchorPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        }
        
        .feature-point {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(0, 255, 255, 0.8);
            border: 1px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 140;
            pointer-events: none;
            animation: featurePulse 2s infinite;
        }
        
        @keyframes featurePulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .world-tracking-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
        }
        
        .world-tracking-info.show {
            opacity: 1;
        }
        
        .loading-text {
            margin-top: 15px;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .debug-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            z-index: 200;
            max-width: 280px;
            display: none;
            border: 1px solid rgba(0,255,0,0.3);
        }
        
        .debug-overlay.show {
            display: block;
        }
        
        .touch-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 120;
            pointer-events: none;
            animation: touchRipple 0.6s ease-out;
        }
        
        @keyframes touchRipple {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
        
        .slam-status {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .slam-status.tracking {
            background: rgba(0, 255, 0, 0.8);
            color: black;
        }
        
        .slam-status.lost {
            background: rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>🤖 AR SLAM 시스템</h2>
        <div class="loading-text" id="loading-text">SLAM 초기화 중...</div>
    </div>
    
    <!-- 카메라 권한 요청 -->
    <div id="camera-permission" class="camera-permission">
        <h3>🤖 AR SLAM 시스템</h3>
        <p>실시간 환경 매핑과 위치 추적을 위해<br>카메라와 센서 접근이 필요합니다.</p>
        <div style="margin: 20px 0;">
            <button class="permission-btn" onclick="requestPermissions()">
                🚀 SLAM 시작
            </button>
            <br>
            <button class="permission-btn secondary" onclick="skipCamera()">
                센서만 사용
            </button>
        </div>
    </div>
    
    <!-- SLAM 상태 -->
    <div id="slam-status" class="slam-status">SLAM 초기화 중...</div>
    
    <!-- 월드 트래킹 정보 -->
    <div id="world-tracking-info" class="world-tracking-info">
        🤖 SLAM이 환경을 분석하고 있습니다<br>
        <small>카메라를 천천히 움직여주세요</small>
    </div>
    
    <!-- 디버그 오버레이 -->
    <div id="debug-overlay" class="debug-overlay">
        <div id="debug-content"></div>
    </div>
    
    <!-- SLAM 캔버스 -->
    <canvas id="slam-canvas"></canvas>
    
    <!-- 카메라 배경 -->
    <video id="camera-background" autoplay muted playsinline></video>
    
    <!-- 3D 컨테이너 -->
    <div id="container">
        <div id="three-container"></div>
    </div>
    
    <!-- 컨트롤 -->
    <div class="controls">
        <button class="control-btn" onclick="toggleVideo()" title="재생/정지">⏯️</button>
        <button class="control-btn" onclick="toggleSLAM()" title="SLAM" id="slam-btn">🤖</button>
        <button class="control-btn" onclick="resetSLAM()" title="SLAM 리셋">🎯</button>
        <button class="control-btn" onclick="toggleDebug()" title="디버그">🐛</button>
        <a href="index.html" class="control-btn" title="홈으로">🏠</a>
    </div>
    
    <!-- OpenCV.js CDN -->
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" onload="onOpenCvReady()"></script>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 전역 변수
        let scene, camera, renderer, video, videoTexture, videoMesh;
        let cameraStream = null;
        let cameraVideo = null;
        let isCameraActive = false;
        let debugMode = false;
        let touchEnabled = false;
        let slamEnabled = false;
        let openCvReady = false;
        
        // SLAM 관련 변수
        let slamCanvas, slamCtx;
        let featureDetector = null;
        let keypoints = [];
        let descriptors = null;
        let previousFrame = null;
        let cameraMatrix = null;
        let slamState = 'initializing'; // initializing, tracking, lost
        
        let worldTracking = {
            anchors: [],
            deviceOrientation: { alpha: 0, beta: 0, gamma: 0 },
            isTracking: false,
            trackingQuality: 'none',
            slamFeatures: [],
            cameraPosition: { x: 0, y: 0, z: 0 },
            cameraRotation: { x: 0, y: 0, z: 0 }
        };
        
        // OpenCV 준비 완료 콜백
        function onOpenCvReady() {
            if (typeof cv !== 'undefined') {
                openCvReady = true;
                debugLog('OpenCV.js 로드 완료');
                initializeSLAM();
            }
        }
        
        // SLAM 시스템 초기화
        function initializeSLAM() {
            if (!openCvReady) {
                debugLog('OpenCV.js 아직 로드되지 않음');
                return;
            }
            
            debugLog('SLAM 시스템 초기화 시작');
            
            // SLAM 캔버스 설정
            slamCanvas = document.getElementById('slam-canvas');
            slamCtx = slamCanvas.getContext('2d');
            
            // 캔버스 크기 설정
            slamCanvas.width = 320; // 성능을 위해 작은 해상도 사용
            slamCanvas.height = 240;
            
            try {
                // ORB 특징점 검출기 초기화 (OpenCV.js에서 지원하는 경우)
                if (cv.ORB) {
                    featureDetector = new cv.ORB(500); // 최대 500개 특징점
                    debugLog('ORB 특징점 검출기 초기화 완료');
                } else {
                    // Fast 특징점 검출기 대안
                    debugLog('ORB 미지원, FAST 검출기 사용');
                }
                
                // 카메라 매트릭스 추정 (간단한 모델)
                const fx = 320; // 초점 거리 (픽셀)
                const fy = 320;
                const cx = 160; // 주점 (이미지 중심)
                const cy = 120;
                
                cameraMatrix = cv.matFromArray(3, 3, cv.CV_64FC1, [
                    fx, 0, cx,
                    0, fy, cy,
                    0, 0, 1
                ]);
                
                slamState = 'ready';
                updateSLAMStatus('SLAM 준비 완료');
                debugLog('SLAM 초기화 완료');
                
            } catch (error) {
                debugLog(`SLAM 초기화 실패: ${error.message}`);
                slamState = 'error';
                updateSLAMStatus('SLAM 초기화 실패');
            }
        }
        
        // SLAM 처리 함수
        function processSLAMFrame() {
            if (!slamEnabled || !openCvReady || !cameraVideo || slamState === 'error') {
                return;
            }
            
            try {
                // 비디오 프레임을 캔버스에 그리기
                slamCtx.drawImage(cameraVideo, 0, 0, slamCanvas.width, slamCanvas.height);
                
                // 이미지 데이터 가져오기
                const imageData = slamCtx.getImageData(0, 0, slamCanvas.width, slamCanvas.height);
                const src = cv.matFromImageData(imageData);
                
                // 그레이스케일 변환
                const gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                
                // 특징점 검출
                const currentKeypoints = new cv.KeyPointVector();
                const currentDescriptors = new cv.Mat();
                
                if (featureDetector) {
                    // ORB 특징점 검출
                    featureDetector.detectAndCompute(gray, new cv.Mat(), currentKeypoints, currentDescriptors);
                } else {
                    // 간단한 코너 검출 (Harris Corner)
                    const corners = new cv.Mat();
                    cv.goodFeaturesToTrack(gray, corners, 100, 0.01, 10);
                    
                    // 코너를 특징점으로 변환
                    for (let i = 0; i < corners.rows; i++) {
                        const x = corners.data32F[i * 2];
                        const y = corners.data32F[i * 2 + 1];
                        const kp = new cv.KeyPoint(x, y, 10);
                        currentKeypoints.push_back(kp);
                    }
                    corners.delete();
                }
                
                // 특징점 매칭 및 추적
                if (previousFrame && descriptors && !descriptors.empty() && !currentDescriptors.empty()) {
                    matchAndTrackFeatures(currentDescriptors, currentKeypoints);
                } else {
                    slamState = 'initializing';
                    updateSLAMStatus('환경 초기화 중...');
                }
                
                // 특징점 시각화
                visualizeFeatures(currentKeypoints);
                
                // 이전 프레임 정보 저장
                if (previousFrame) previousFrame.delete();
                previousFrame = gray.clone();
                
                if (descriptors) descriptors.delete();
                descriptors = currentDescriptors.clone();
                
                // 정리
                src.delete();
                gray.delete();
                currentKeypoints.delete();
                currentDescriptors.delete();
                
            } catch (error) {
                debugLog(`SLAM 프레임 처리 실패: ${error.message}`);
                slamState = 'lost';
                updateSLAMStatus('SLAM 오류');
            }
        }
        
        // 특징점 매칭 및 추적
        function matchAndTrackFeatures(currentDescriptors, currentKeypoints) {
            try {
                // BF 매처 생성
                const matcher = new cv.BFMatcher(cv.NORM_HAMMING, true);
                const matches = new cv.DMatchVector();
                
                // 특징점 매칭
                matcher.match(descriptors, currentDescriptors, matches);
                
                // 좋은 매칭만 필터링
                const goodMatches = [];
                const matchArray = [];
                
                for (let i = 0; i < matches.size(); i++) {
                    matchArray.push(matches.get(i));
                }
                
                // 거리 기준으로 정렬
                matchArray.sort((a, b) => a.distance - b.distance);
                
                // 상위 50% 매칭만 사용
                const numGoodMatches = Math.min(50, Math.floor(matchArray.length * 0.5));
                
                if (numGoodMatches > 8) { // 최소 8개 매칭 필요
                    slamState = 'tracking';
                    updateSLAMStatus(`SLAM 추적 중 (${numGoodMatches} 특징점)`);
                    
                    // 카메라 포즈 추정 (간단한 버전)
                    estimateCameraPose(matchArray.slice(0, numGoodMatches), currentKeypoints);
                    
                    worldTracking.trackingQuality = 'good';
                } else {
                    slamState = 'lost';
                    updateSLAMStatus('추적 실패 - 재초기화 중...');
                    worldTracking.trackingQuality = 'poor';
                }
                
                // 정리
                matcher.delete();
                matches.delete();
                
            } catch (error) {
                debugLog(`특징점 매칭 실패: ${error.message}`);
                slamState = 'lost';
            }
        }
        
        // 카메라 포즈 추정
        function estimateCameraPose(matches, currentKeypoints) {
            try {
                // 간단한 포즈 추정 (실제로는 더 복잡한 알고리즘 필요)
                let deltaX = 0, deltaY = 0, deltaZ = 0;
                let deltaRotX = 0, deltaRotY = 0, deltaRotZ = 0;
                
                // 매칭된 점들의 이동량 계산
                for (let i = 0; i < Math.min(matches.length, 10); i++) {
                    const match = matches[i];
                    const currentKp = currentKeypoints.get(match.trainIdx);
                    
                    // 이전 특징점과 현재 특징점의 차이로 움직임 추정
                    if (keypoints.length > match.queryIdx) {
                        const prevKp = keypoints[match.queryIdx];
                        deltaX += (currentKp.pt.x - prevKp.pt.x) * 0.001;
                        deltaY += (currentKp.pt.y - prevKp.pt.y) * 0.001;
                    }
                }
                
                // 센서 데이터와 융합
                const sensorWeight = 0.3;
                const visionWeight = 0.7;
                
                // 카메라 위치 업데이트
                worldTracking.cameraPosition.x += deltaX * visionWeight;
                worldTracking.cameraPosition.y += deltaY * visionWeight;
                worldTracking.cameraPosition.z += deltaZ * visionWeight;
                
                // 센서 데이터 융합
                const { alpha, beta, gamma } = worldTracking.deviceOrientation;
                worldTracking.cameraRotation.x = beta * Math.PI / 180 * sensorWeight + worldTracking.cameraRotation.x * (1 - sensorWeight);
                worldTracking.cameraRotation.y = alpha * Math.PI / 180 * sensorWeight + worldTracking.cameraRotation.y * (1 - sensorWeight);
                worldTracking.cameraRotation.z = gamma * Math.PI / 180 * sensorWeight + worldTracking.cameraRotation.z * (1 - sensorWeight);
                
                // Three.js 카메라에 적용
                if (camera) {
                    camera.position.x += deltaX * 10;
                    camera.position.y -= deltaY * 10; // Y축 반전
                    
                    camera.rotation.x = worldTracking.cameraRotation.x * 0.5;
                    camera.rotation.y = worldTracking.cameraRotation.y * 0.5;
                    camera.rotation.z = worldTracking.cameraRotation.z * 0.3;
                }
                
            } catch (error) {
                debugLog(`카메라 포즈 추정 실패: ${error.message}`);
            }
        }
        
        // 특징점 시각화
        function visualizeFeatures(keypoints) {
            // 이전 특징점 제거
            document.querySelectorAll('.feature-point').forEach(el => el.remove());
            
            // 새 특징점 표시 (처음 20개만)
            const maxFeatures = 20;
            const scaleX = window.innerWidth / slamCanvas.width;
            const scaleY = window.innerHeight / slamCanvas.height;
            
            worldTracking.slamFeatures = [];
            
            for (let i = 0; i < Math.min(keypoints.size(), maxFeatures); i++) {
                const kp = keypoints.get(i);
                const screenX = kp.pt.x * scaleX;
                const screenY = kp.pt.y * scaleY;
                
                // 화면 경계 체크
                if (screenX < 0 || screenX > window.innerWidth || screenY < 0 || screenY > window.innerHeight) {
                    continue;
                }
                
                const featureElement = document.createElement('div');
                featureElement.className = 'feature-point';
                featureElement.style.left = screenX + 'px';
                featureElement.style.top = screenY + 'px';
                document.body.appendChild(featureElement);
                
                worldTracking.slamFeatures.push({ x: screenX, y: screenY });
            }
        }
        
        // SLAM 상태 업데이트
        function updateSLAMStatus(status) {
            const statusElement = document.getElementById('slam-status');
            statusElement.textContent = status;
            
            statusElement.className = 'slam-status';
            if (slamState === 'tracking') {
                statusElement.classList.add('tracking');
            } else if (slamState === 'lost') {
                statusElement.classList.add('lost');
            }
        }
        
        // SLAM 토글
        function toggleSLAM() {
            slamEnabled = !slamEnabled;
            const slamBtn = document.getElementById('slam-btn');
            
            if (slamEnabled) {
                slamBtn.classList.add('active');
                debugLog('SLAM 활성화');
                updateSLAMStatus('SLAM 시작됨');
                
                if (openCvReady) {
                    // SLAM 처리 루프 시작
                    setInterval(processSLAMFrame, 100); // 10 FPS
                }
            } else {
                slamBtn.classList.remove('active');
                debugLog('SLAM 비활성화');
                updateSLAMStatus('SLAM 중지됨');
                
                // 특징점 제거
                document.querySelectorAll('.feature-point').forEach(el => el.remove());
            }
        }
        
        // SLAM 리셋
        function resetSLAM() {
            debugLog('SLAM 시스템 리셋');
            
            // 상태 초기화
            slamState = 'initializing';
            worldTracking.cameraPosition = { x: 0, y: 0, z: 0 };
            worldTracking.cameraRotation = { x: 0, y: 0, z: 0 };
            worldTracking.slamFeatures = [];
            
            // 이전 프레임 데이터 정리
            if (previousFrame) {
                previousFrame.delete();
                previousFrame = null;
            }
            if (descriptors) {
                descriptors.delete();
                descriptors = null;
            }
            
            keypoints = [];
            
            // 특징점 제거
            document.querySelectorAll('.feature-point').forEach(el => el.remove());
            
            // 앵커 리셋
            resetAnchors();
            
            // 카메라 위치 리셋
            if (camera) {
                camera.position.set(0, 1.6, 2);
                camera.rotation.set(0, 0, 0);
            }
            
            updateSLAMStatus('SLAM 리셋 완료');
        }
        
        // 디버그 로그 함수
        function debugLog(message, type = 'info') {
            console.log(`[AR SLAM] ${message}`);
            
            if (debugMode) {
                const debugContent = document.getElementById('debug-content');
                if (debugContent) {
                    const timestamp = new Date().toLocaleTimeString();
                    debugContent.innerHTML = `
                        <div><strong>SLAM 상태:</strong> ${slamState}</div>
                        <div><strong>특징점:</strong> ${worldTracking.slamFeatures.length}</div>
                        <div><strong>추적 품질:</strong> ${worldTracking.trackingQuality}</div>
                        <div><strong>앵커:</strong> ${worldTracking.anchors.length}</div>
                        <div><strong>카메라 위치:</strong> (${worldTracking.cameraPosition.x.toFixed(2)}, ${worldTracking.cameraPosition.y.toFixed(2)}, ${worldTracking.cameraPosition.z.toFixed(2)})</div>
                        <div><strong>센서:</strong> α${worldTracking.deviceOrientation.alpha.toFixed(1)}° β${worldTracking.deviceOrientation.beta.toFixed(1)}° γ${worldTracking.deviceOrientation.gamma.toFixed(1)}°</div>
                        <div><strong>OpenCV:</strong> ${openCvReady ? '준비됨' : '로딩중'}</div>
                        <hr style="margin: 5px 0;">
                        <div style="font-size: 10px;">[${timestamp}] ${message}</div>
                    `;
                }
            }
        }
        
        // 월드 트래킹 초기화
        function initializeWorldTracking() {
            debugLog('월드 트래킹 시스템 초기화');
            
            // 디바이스 방향 센서
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    debugLog('iOS 디바이스 방향 권한 필요');
                } else {
                    window.addEventListener('deviceorientation', handleDeviceOrientation);
                    debugLog('디바이스 방향 센서 활성화');
                }
            } else {
                debugLog('디바이스 방향 센서 미지원');
            }
            
            // 디바이스 모션 센서
            if (window.DeviceMotionEvent) {
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    debugLog('iOS 디바이스 모션 권한 필요');
                } else {
                    window.addEventListener('devicemotion', handleDeviceMotion);
                    debugLog('디바이스 모션 센서 활성화');
                }
            } else {
                debugLog('디바이스 모션 센서 미지원');
            }
            
            // 터치 이벤트 활성화
            enableTouchEvents();
            
            worldTracking.isTracking = true;
            worldTracking.trackingQuality = 'good';
            
            showWorldTrackingInfo();
            debugLog('월드 트래킹 활성화 완료');
        }
        
        function enableTouchEvents() {
            touchEnabled = true;
            
            // 터치 이벤트
            document.addEventListener('touchstart', handleTouch, { passive: false });
            document.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // 마우스 이벤트 (PC 테스트용)
            document.addEventListener('mousedown', handleTouch, { passive: false });
            
            debugLog('터치 이벤트 활성화');
        }
        
        function handleDeviceOrientation(event) {
            const newOrientation = {
                alpha: event.alpha || 0,
                beta: event.beta || 0,
                gamma: event.gamma || 0
            };
            
            const threshold = 1;
            if (Math.abs(newOrientation.alpha - worldTracking.deviceOrientation.alpha) > threshold ||
                Math.abs(newOrientation.beta - worldTracking.deviceOrientation.beta) > threshold ||
                Math.abs(newOrientation.gamma - worldTracking.deviceOrientation.gamma) > threshold) {
                
                worldTracking.deviceOrientation = newOrientation;
                
                // SLAM이 비활성화된 경우에만 센서로 카메라 조정
                if (camera && worldTracking.isTracking && !slamEnabled) {
                    updateCameraOrientation();
                }
            }
        }
        
        function handleDeviceMotion(event) {
            const acceleration = event.acceleration;
            if (acceleration && worldTracking.isTracking) {
                const totalAccel = Math.sqrt(
                    acceleration.x * acceleration.x +
                    acceleration.y * acceleration.y +
                    acceleration.z * acceleration.z
                );
                
                if (totalAccel > 2) {
                    worldTracking.trackingQuality = 'limited';
                } else {
                    worldTracking.trackingQuality = 'good';
                }
            }
        }
        
        function updateCameraOrientation() {
            if (!camera || !worldTracking.isTracking || slamEnabled) return;
            
            const { alpha, beta, gamma } = worldTracking.deviceOrientation;
            
            const smoothing = 0.05;
            const alphaRad = (alpha * Math.PI) / 180;
            const betaRad = (beta * Math.PI) / 180;
            const gammaRad = (gamma * Math.PI) / 180;
            
            camera.rotation.x += (betaRad * 0.5 - camera.rotation.x) * smoothing;
            camera.rotation.y += (alphaRad * 0.5 - camera.rotation.y) * smoothing;
            camera.rotation.z += (gammaRad * 0.3 - camera.rotation.z) * smoothing;
        }
        
        function handleTouch(event) {
            if (!worldTracking.isTracking || !touchEnabled) return;
            
            event.preventDefault();
            event.stopPropagation();
            
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            debugLog(`터치 감지: (${clientX}, ${clientY})`);
            
            showTouchIndicator(clientX, clientY);
            createAnchor(clientX, clientY);
        }
        
        function handleTouchEnd(event) {
            // 터치 종료 처리
        }
        
        function showTouchIndicator(x, y) {
            const indicator = document.createElement('div');
            indicator.className = 'touch-indicator';
            indicator.style.left = x + 'px';
            indicator.style.top = y + 'px';
            document.body.appendChild(indicator);
            
            setTimeout(() => {
                if (indicator.parentNode) {
                    document.body.removeChild(indicator);
                }
            }, 600);
        }
        
        function createAnchor(x, y) {
            debugLog(`앵커 생성 시도: (${x}, ${y})`);
            
            worldTracking.anchors = [];
            document.querySelectorAll('.anchor-point').forEach(el => el.remove());
            
            const normalizedX = (x / window.innerWidth) * 2 - 1;
            const normalizedY = -(y / window.innerHeight) * 2 + 1;
            
            debugLog(`정규화된 좌표: (${normalizedX.toFixed(2)}, ${normalizedY.toFixed(2)})`);
            
            // SLAM이 활성화된 경우 더 정확한 3D 위치 계산
            let distance = 2;
            if (slamEnabled && slamState === 'tracking') {
                // SLAM 데이터를 사용한 더 정확한 깊이 추정
                distance = 1.5 + Math.random() * 1; // 1.5-2.5m 범위
            }
            
            const worldX = normalizedX * distance;
            const worldY = normalizedY * distance;
            const worldZ = -distance;
            
            const worldPosition = new THREE.Vector3(worldX, worldY, worldZ);
            
            const anchor = {
                id: Date.now(),
                position: worldPosition,
                screenPosition: { x, y },
                timestamp: Date.now(),
                slamBased: slamEnabled && slamState === 'tracking'
            };
            
            worldTracking.anchors.push(anchor);
            
            debugLog(`앵커 생성됨: 3D(${worldX.toFixed(2)}, ${worldY.toFixed(2)}, ${worldZ.toFixed(2)}) SLAM: ${anchor.slamBased}`);
            
            if (videoMesh) {
                videoMesh.position.copy(worldPosition);
                debugLog('비디오 메시 위치 업데이트');
            }
            
            showAnchorPoint(x, y);
        }
        
        function showAnchorPoint(x, y) {
            const anchorElement = document.createElement('div');
            anchorElement.className = 'anchor-point';
            anchorElement.style.left = x + 'px';
            anchorElement.style.top = y + 'px';
            document.body.appendChild(anchorElement);
            
            debugLog(`앵커 포인트 UI 표시: (${x}, ${y})`);
            
            setTimeout(() => {
                if (anchorElement.parentNode) {
                    document.body.removeChild(anchorElement);
                }
            }, 5000);
        }
        
        function showWorldTrackingInfo() {
            const info = document.getElementById('world-tracking-info');
            info.classList.add('show');
            
            setTimeout(() => {
                info.classList.remove('show');
            }, 8000);
        }
        
        function resetAnchors() {
            worldTracking.anchors = [];
            
            if (videoMesh) {
                videoMesh.position.set(0, 0, -2);
            }
            
            document.querySelectorAll('.anchor-point').forEach(el => el.remove());
            
            debugLog('모든 앵커 리셋');
        }
        
        function toggleDebug() {
            debugMode = !debugMode;
            const debugOverlay = document.getElementById('debug-overlay');
            
            if (debugMode) {
                debugOverlay.classList.add('show');
                debugLog('디버그 모드 활성화');
            } else {
                debugOverlay.classList.remove('show');
            }
        }
        
        // 로딩 상태 업데이트
        function updateLoadingText(text) {
            const loadingText = document.getElementById('loading-text');
            if (loadingText) {
                loadingText.textContent = text;
            }
            debugLog(`로딩: ${text}`);
        }
        
        // 초기화
        function initialize() {
            debugLog('AR SLAM 시스템 초기화 시작');
            updateLoadingText('OpenCV.js 로딩 중...');
            
            // OpenCV 로딩 대기
            const checkOpenCV = setInterval(() => {
                if (openCvReady) {
                    clearInterval(checkOpenCV);
                    updateLoadingText('센서 확인 중...');
                    
                    setTimeout(() => {
                        updateLoadingText('권한 요청 준비...');
                        
                        setTimeout(() => {
                            showCameraPermission();
                            updateLoadingText('권한 대기 중...');
                        }, 500);
                    }, 1000);
                }
            }, 500);
            
            // 10초 후에도 OpenCV가 로드되지 않으면 진행
            setTimeout(() => {
                if (!openCvReady) {
                    clearInterval(checkOpenCV);
                    debugLog('OpenCV 로딩 타임아웃 - 센서 모드로 진행');
                    updateLoadingText('센서 모드로 진행...');
                    
                    setTimeout(() => {
                        showCameraPermission();
                        updateLoadingText('권한 대기 중...');
                    }, 500);
                }
            }, 10000);
        }
        
        function showCameraPermission() {
            const permissionDiv = document.getElementById('camera-permission');
            permissionDiv.classList.add('show');
        }
        
        function hideCameraPermission() {
            const permissionDiv = document.getElementById('camera-permission');
            permissionDiv.classList.remove('show');
        }
        
        async function requestPermissions() {
            hideCameraPermission();
            updateLoadingText('센서 권한 요청 중...');
            
            // iOS에서 디바이스 방향 권한 요청
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleDeviceOrientation);
                        debugLog('디바이스 방향 권한 허용됨');
                    } else {
                        debugLog('디바이스 방향 권한 거부됨');
                    }
                } catch (error) {
                    debugLog(`디바이스 방향 권한 요청 실패: ${error.message}`);
                }
            }
            
            // iOS에서 디바이스 모션 권한 요청
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('devicemotion', handleDeviceMotion);
                        debugLog('디바이스 모션 권한 허용됨');
                    } else {
                        debugLog('디바이스 모션 권한 거부됨');
                    }
                } catch (error) {
                    debugLog(`디바이스 모션 권한 요청 실패: ${error.message}`);
                }
            }
            
            updateLoadingText('카메라 접근 중...');
            
            // 카메라 권한 요청
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                cameraStream = stream;
                cameraVideo = document.getElementById('camera-background');
                cameraVideo.srcObject = stream;
                isCameraActive = true;
                
                debugLog('카메라 활성화 성공');
                updateLoadingText('SLAM 시스템 준비 중...');
                
                setTimeout(() => {
                    initializeThreeJS();
                    initializeWorldTracking();
                    
                    // SLAM 자동 시작
                    if (openCvReady) {
                        setTimeout(() => {
                            toggleSLAM();
                        }, 2000);
                    }
                }, 1000);
                
            } catch (error) {
                debugLog(`카메라 접근 실패: ${error.message}`);
                updateLoadingText('카메라 없이 진행...');
                setTimeout(() => {
                    initializeWithoutCamera();
                    initializeWorldTracking();
                }, 1000);
            }
        }
        
        function skipCamera() {
            hideCameraPermission();
            updateLoadingText('센서 모드로 진행...');
            setTimeout(() => {
                initializeWithoutCamera();
                initializeWorldTracking();
            }, 1000);
        }
        
        function initializeWithoutCamera() {
            document.getElementById('camera-background').style.display = 'none';
            initializeThreeJS();
        }
        
        function initializeThreeJS() {
            debugLog('Three.js 초기화 시작');
            
            try {
                updateLoadingText('3D 환경 생성 중...');
                
                scene = new THREE.Scene();
                
                if (!isCameraActive) {
                    scene.background = new THREE.Color(0x222222);
                }
                
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 2);
                
                renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.setClearColor(0x000000, isCameraActive ? 0 : 1);
                
                document.getElementById('three-container').appendChild(renderer.domElement);
                
                // 조명
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                // 비디오 엘리먼트
                video = document.createElement('video');
                video.src = 'assets/lee.mp4';
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                // 비디오 텍스처
                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                
                // 비디오 스크린 (AR 오브젝트)
                const screenGeometry = new THREE.PlaneGeometry(1.6, 0.9);
                const screenMaterial = new THREE.MeshLambertMaterial({ 
                    map: videoTexture,
                    transparent: true,
                    opacity: 0.95
                });
                
                videoMesh = new THREE.Mesh(screenGeometry, screenMaterial);
                videoMesh.position.set(0, 0, -2);
                videoMesh.castShadow = true;
                scene.add(videoMesh);
                
                // 참조용 바닥
                const floorGeometry = new THREE.PlaneGeometry(10, 10);
                const floorMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0x404040,
                    transparent: true,
                    opacity: isCameraActive ? 0 : 0.2
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -1;
                floor.receiveShadow = true;
                scene.add(floor);
                
                // 비디오 로드 이벤트
                video.addEventListener('loadeddata', () => {
                    debugLog('비디오 로드 완료');
                    video.play().catch(console.log);
                });
                
                // 렌더 루프
                animate();
                
                // 리사이즈 이벤트
                window.addEventListener('resize', onWindowResize);
                
                debugLog('Three.js 초기화 완료');
                updateLoadingText('완료!');
                setTimeout(finishLoading, 1000);
                
            } catch (error) {
                debugLog(`Three.js 초기화 실패: ${error.message}`);
                updateLoadingText('초기화 실패');
                setTimeout(finishLoading, 2000);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // 월드 트래킹 업데이트
            if (worldTracking.isTracking) {
                updateWorldTracking();
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function updateWorldTracking() {
            // 앵커 포인트가 있으면 비디오를 고정
            if (worldTracking.anchors.length > 0 && videoMesh) {
                const anchor = worldTracking.anchors[0];
                
                // SLAM 기반 앵커는 더 정확한 위치 유지
                if (anchor.slamBased && slamEnabled && slamState === 'tracking') {
                    // SLAM으로 추적된 위치는 카메라 움직임에 따라 자동 조정됨
                    videoMesh.position.copy(anchor.position);
                } else {
                    // 센서 기반 위치 보정
                    const orientationOffset = new THREE.Vector3(
                        Math.sin(worldTracking.deviceOrientation.gamma * Math.PI / 180) * 0.02,
                        Math.sin(worldTracking.deviceOrientation.beta * Math.PI / 180) * 0.02,
                        0
                    );
                    
                    videoMesh.position.copy(anchor.position);
                    videoMesh.position.add(orientationOffset);
                }
            }
        }
        
        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        function finishLoading() {
            const loading = document.getElementById('loading');
            loading.style.opacity = '0';
            
            setTimeout(() => {
                loading.style.display = 'none';
                debugLog('AR SLAM 시스템 준비 완료');
            }, 500);
        }
        
        // 컨트롤 함수
        function toggleVideo() {
            if (video) {
                if (video.paused) {
                    video.play().catch(console.log);
                    debugLog('비디오 재생');
                } else {
                    video.pause();
                    debugLog('비디오 정지');
                }
            }
        }
        
        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            
            // OpenCV 메모리 정리
            if (previousFrame) previousFrame.delete();
            if (descriptors) descriptors.delete();
            if (cameraMatrix) cameraMatrix.delete();
        });
        
        // 초기화 시작
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
    </script>
</body>
