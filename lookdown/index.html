<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>LOOK DOWN</title>
    <meta name="description" content="비 오는 밤엔, 바닥을 보세요.">
    <meta property="og:title" content="LOOK DOWN">
    <meta property="og:description" content="비 오는 밤엔, 바닥을 보세요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://epispace.kr/lookdown/">
    <meta name="theme-color" content="#0b1420">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="lookdown.css">
    <script type="importmap">
    {
        "imports": {
            "three": "../assets/vendor/three-0.160.0/three.module.js",
            "three/addons/": "../assets/vendor/three-0.160.0/addons/"
        }
    }
    </script>
</head>
<body>
    <!-- 0단계 「비춤」: 바닥을 비추면 웅덩이가 고이고 Yuni가 떠올라 한마디 합니다. 글은 lines.json, 수치는 lookdown.js 맨 위에 있습니다. -->
    <div id="scene"></div>

    <!-- 시작: 한 줄과 탭. 카메라·센서 권한은 터치 한 번 안에서 받아야 해서 이 화면만은 남깁니다. -->
    <button class="start" id="start" type="button">
        <span class="wordmark" aria-hidden="true">LOOK DOWN</span>
        <span class="start-line" data-text="start"></span>
        <span class="start-tap" data-text="tap"></span>
        <span class="drop" aria-hidden="true"></span>
    </button>

    <div class="ui" id="ui">
        <p class="hint" id="hint" role="status"></p>
        <p class="caption" id="caption" aria-live="polite"></p>
        <p class="notice" id="notice" hidden></p>
        <p class="tag" id="tag" aria-hidden="true">003</p>
    </div>

    <!-- 나가기: 비침 워드마크 + 한 줄 + 버튼 하나. lookdown/assets/wordmark.png 가 있으면 글자 대신 그 이미지를 씁니다. -->
    <div class="end" id="end" hidden>
        <p class="end-fortune" id="end-fortune"></p>
        <div class="mark">
            <img id="wordmark" src="assets/wordmark.png" alt="LOOK DOWN" hidden>
            <span class="mark-text" aria-hidden="true">LOOK DOWN</span>
            <span class="mark-reflect" aria-hidden="true">LOOK DOWN</span>
        </div>
        <p class="end-line" data-text="end"></p>
        <button class="btn-share" id="btn-share" type="button" data-text="share"></button>
        <span class="share-hint" id="share-hint" data-text="share_hint"></span>
    </div>

    <div class="err" id="err" hidden><p></p></div>

    <script type="module" src="lookdown.js"></script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXQEGVBYP8"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-DXQEGVBYP8');
    </script>
</body>
</html>
